};
/* 实时天气：Open-Meteo 免费接口（无需 key），失败则回退静态展示 */
async function loadWeather(){
  try{
    const city=DB.outfitCity||'北京市海淀区';
    const geoName=CITY_GEO[city]||city;
    const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(geoName)+'&count=1&language=zh&format=json').then(r=>r.json());
    const loc=(g.results&&g.results[0])||null;
    if(!loc) throw new Error('geocode fail');
    const f=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,weather_code&timezone=auto').then(r=>r.json());
    const c=f.current||{};
    const temp=Math.round(c.temperature_2m);
    const wm=weatherMeta(c.weather_code);
    const set=(id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
    set('wTemp', temp+'°C');
    set('wCond', wm.text+' · '+wm.emoji);
    const ic=document.getElementById('wIco'); if(ic) ic.textContent=wm.emoji;
    set('wTime', '更新于 '+new Date().toTimeString().slice(0,5));
    DB._weather={temp, code:c.weather_code, text:wm.text, kind:wm.kind, time:Date.now()};
  }catch(e){ console.warn('weather fail', e); }
}
/* WMO 天气代码 → 中文 + 图标 */
function weatherMeta(code){
  const m={0:['晴','☀️'],1:['大部晴朗','🌤'],2:['多云','⛅'],3:['阴','☁️'],45:['雾','🌫'],48:['雾凇','🌫'],
    51:['毛毛雨','🌦'],53:['毛毛雨','🌦'],55:['毛毛雨','🌦'],61:['小雨','🌧'],63:['中雨','🌧'],65:['大雨','🌧'],
    71:['小雪','🌨'],73:['中雪','🌨'],75:['大雪','🌨'],77:['雪粒','🌨'],80:['阵雨','🌦'],81:['阵雨','🌦'],82:['强阵雨','🌧'],
    95:['雷阵雨','⛈'],96:['雷雨冰雹','⛈'],99:['雷雨冰雹','⛈']};
  const def=m[code]||['阴晴','🌤'];
  let kind='cloud';
  if(code===0||code===1) kind='sunny';
  else if(code>=71&&code<=77) kind='snow';
  else if(code>=51&&code<=67||code>=80&&code<=82||code>=95) kind='rain';
  return {text:def[0],emoji:def[1],kind};
}
/* 按温度给出穿搭建议 */
function clothingSug(temp, kind){
  let line1='';
  if(temp>=32) line1='炎热 · 短袖';
  else if(temp>=28) line1='热 · 短袖/薄衫';
  else if(temp>=24) line1='舒适 · 薄外套+短袖';
  else if(temp>=19) line1='微凉 · 针织/薄外套';
  else if(temp>=13) line1='较冷 · 风衣/夹克';
  else if(temp>=6) line1='冷 · 毛衣/厚外套';
  else line1='寒冷 · 羽绒服';
  let line2 = kind==='rain' ? '☂️ 记得带伞' : kind==='snow' ? '🧣 注意保暖' : '☀️ 可出门活动';
  return line1+'<br>'+line2;
}

let sportTab='dance';
const SPORT_RATES=[0.5,0.75,1];
function renderSport(){
  pagesEl.innerHTML=`
    <h1 class="page-title">${tIcon('sport')}运动</h1>
    <div class="page-sub">跟着视频动起来</div>
    <div class="tabs">
      ${['dance','other'].map(id=>`<button class="tab-btn ${sportTab===id?'on':''}" data-tab="${id}">${tabLabel('sport',id)}</button>`).join('')}${renameBtnHTML('sport')}
    </div>
    ${sportCounterHTML()}
    ${sportVideoHTML(sportTab)}`;
  pagesEl.querySelectorAll('.tab-btn').forEach(b=>{ b.onclick=()=>{ sportTab=b.dataset.tab; renderSport(); }; });
  bindSport();
}
function sportCounterHTML(){
  const cnt=DB.sportVideos.counter[sportTab]||0, goal=DB.sportVideos.goal[sportTab]||300;
  return `<div class="card sport-counter">
    <div class="sc-top"><span style="font-size:13px;font-weight:700">✊ 打卡计数（${sportTab==='dance'?'舞蹈':'其他'}）</span><span style="font-size:12px;color:var(--text-soft)">${cnt} / ${goal}</span></div>
    <div class="sc-count">${cnt}</div>
    <button class="sc-plus" id="scPlus">+1</button>
    <button class="sc-reset" id="scReset">重置</button>
    <div class="sc-goal"><label class="f-label">目标次数</label><input type="number" id="scGoal" value="${goal}" min="1"><button class="btn btn-ghost btn-sm btn-block" id="scSetGoal" style="margin-top:8px">设置目标</button></div>
  </div>`;
}
function sportVideoHTML(tab){
  const vids=DB.sportVideos[tab]||[];
  return `<div class="card">
    <h3>🎬 运动视频（${tab==='dance'?'舞蹈':'其他'}）</h3>
    <button class="btn btn-primary btn-block" id="addVidBtn" style="margin-bottom:12px">＋ 导入视频</button>
    ${vids.length? vids.map(v=>vidCardHTML(v)).join('') : '<div style="text-align:center;color:var(--text-soft);padding:16px">还没有视频，导入一个开始跟练吧</div>'}
    <input type="file" id="vidInput" accept="video/*" style="display:none">
  </div>`;
}
function vidCardHTML(v){
  return `<div class="vid-card">
    <div class="vc-title"><span>▶️ ${escapeHtml(v.name||'运动视频')}</span><button class="vc-del" data-vedit="${v.id}">✏️</button><button class="vc-del" data-vdel="${v.id}">删除</button></div>
    <video src="${mediaSrc(v.src)}" controls playsinline preload="metadata"></video>
    <div class="vc-ctrl"><div class="vc-speed">${SPORT_RATES.map(r=>`<button class="vs-btn" data-vid="${v.id}" data-rate="${r}">${r}×</button>`).join('')}</div></div>
  </div>`;
}
function bindSport(){
  document.getElementById('scPlus').onclick=()=>{ DB.sportVideos.counter[sportTab]=(DB.sportVideos.counter[sportTab]||0)+1; save(); renderSport(); };
  document.getElementById('scReset').onclick=()=>{ DB.sportVideos.counter[sportTab]=0; save(); renderSport(); };
  document.getElementById('scSetGoal').onclick=()=>{ const g=+document.getElementById('scGoal').value||300; DB.sportVideos.goal[sportTab]=g; save(); toast('目标已设'); renderSport(); };
  document.getElementById('addVidBtn').onclick=()=>document.getElementById('vidInput').click();
  document.getElementById('vidInput').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const src=await saveVideo(f, 600); if(!src) return;
    const defName=f.name.replace(/\.[^.]+$/,'');
    const name=prompt('给这个视频起个名字', defName);
    if(name===null){ /* 已取消，不保存 */ return; }
    DB.sportVideos[sportTab].push({id:uid(),name:(name.trim()||defName),src}); save(); renderSport(); toast('视频已保存');
  };
  pagesEl.querySelectorAll('.vs-btn').forEach(b=>{ b.onclick=()=>{
    const vid=b.closest('.vid-card').querySelector('video'); if(!vid)return;
    vid.playbackRate=parseFloat(b.dataset.rate);
    b.closest('.vc-speed').querySelectorAll('.vs-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }; });
  pagesEl.querySelectorAll('[data-vedit]').forEach(b=>{ b.onclick=()=>{
    const v=DB.sportVideos[sportTab].find(x=>x.id===b.dataset.vedit); if(!v)return;
    const name=prompt('修改视频名称', v.name||'');
    if(name===null) return;
    v.name=name.trim()||v.name; save(); renderSport(); toast('已改名');
  }; });
  pagesEl.querySelectorAll('[data-vdel]').forEach(b=>{ b.onclick=()=>{ DB.sportVideos[sportTab]=DB.sportVideos[sportTab].filter(v=>v.id!==b.dataset.vdel); save(); renderSport(); }; });
}

/* ---------- 通用日记/上传页（灵感/读书/手工/穿搭） ---------- */
function renderDiary(kind){
  const cfg = {
    inspire:{emoji:'💡',name:'选题灵感',color:'lemon',allowImg:true,allowVideo:false,allowBook:false},
    read:{emoji:'📖',name:'读书',color:'mint',allowImg:true,allowVideo:false,allowBook:true},
    craft:{emoji:'🧶',name:'手工',color:'peach',allowImg:true,allowVideo:true,allowBook:false},
    outfit:{emoji:'👗',name:'穿搭',color:'pink',allowImg:true,allowVideo:false,allowBook:false},
  }[kind];
  const entries = Object.values(DB[kind]||{}).sort((a,b)=>(b.date||0)-(a.date||0));
  pagesEl.innerHTML = `
    <h1 class="page-title">${tIcon(kind)}${cfg.name}</h1>
    <div class="page-sub">记录图片、视频与心得</div>
    <div class="card">
      <h3>✍️ 写心得</h3>
      <textarea id="newNote" placeholder="写点今天的心得…"></textarea>
      ${cfg.allowBook?`
        <label class="f-label">📚 预留书名</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="newBook" placeholder="输入书名并添加到书单">
          <button class="btn btn-ghost btn-sm" id="addBook">添加</button>
        </div>
        <div class="book-list" id="bookList"></div>`:''}
      ${cfg.allowImg?`<label class="f-label">🖼️ 上传图片</label><input type="file" id="newImgs" accept="image/*" multiple>`:''}
      ${cfg.allowVideo?`<label class="f-label">🎬 上传视频</label><input type="file" id="newVideos" accept="video/*" multiple>`:''}
      <button class="btn btn-primary btn-block" style="margin-top:14px" id="saveEntry">发布</button>
    </div>
    <div id="entries">${entries.map(en=>entryHTML(en,cfg)).join('')||'<div style="text-align:center;color:var(--text-soft);padding:20px">还没有记录哦～</div>'}</div>`;

  // 书名
  if(cfg.allowBook){
    const bl = document.getElementById('bookList');
    const renderBooks=()=>{ bl.innerHTML = DB.books.map(b=>`<div class="book-item"><span>📕</span><span style="flex:1">${escapeHtml(b.name)}</span><button class="del-btn" data-bid="${b.id}">删除</button></div>`).join(''); };
    renderBooks();
    document.getElementById('addBook').onclick=()=>{
      const v=document.getElementById('newBook').value.trim(); if(!v) return toast('请输入书名');
      DB.books.push({id:uid(),name:v}); save(); document.getElementById('newBook').value=''; renderBooks(); toast('已加入书单');
    };
    bl.addEventListener('click',e=>{
      const d=e.target.closest('[data-bid]'); if(!d) return;
      DB.books=DB.books.filter(b=>b.id!==d.dataset.bid); save(); renderBooks();
    });
  }

  // 发布新记录
  document.getElementById('saveEntry').onclick=async()=>{
    const text = document.getElementById('newNote').value.trim();
    const imgs=[], videos=[];
    if(document.getElementById('newImgs')){ for(const f of document.getElementById('newImgs').files){ imgs.push(await saveImage(f)); } }
    if(document.getElementById('newVideos')){ for(const f of document.getElementById('newVideos').files){ const s=await saveVideo(f,600); if(s) videos.push(s); } }
    if(!text && !imgs.length && !videos.length) return toast('请先填写心得或上传文件');
    DB[kind]=DB[kind]||{};
    const id=uid();
    DB[kind][id]={id,date:todayStr(),ts:Date.now(),text,imgs,videos};
    save(); renderDiary(kind); toast('已发布');
  };
  // 编辑 / 删除
  pagesEl.querySelector('#entries').addEventListener('click',e=>{
    const ed=e.target.closest('[data-dedit]'); if(ed){ showDiaryModal(kind, ed.dataset.dedit); return; }
    const d=e.target.closest('[data-del]'); if(!d) return;
    delete DB[kind][d.dataset.del]; save(); renderDiary(kind);
  });
}
function showDiaryModal(kind, id){
  const en=DB[kind]&&DB[kind][id]; if(!en) return;
  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:17px;font-weight:800">编辑心得</div><button class="close" id="dClose">&times;</button></div>
    <label class="f-label">心得</label><textarea id="deText" style="min-height:80px">${escapeHtml(en.text||'')}</textarea>
    <label class="f-label">🖼️ 图片</label>
    <div class="me-media" id="deImgs"></div>
    <input type="file" id="deAddImgs" accept="image/*" multiple>
    <label class="f-label" style="margin-top:10px">🎬 视频</label>
    <div class="me-media" id="deVids"></div>
    <input type="file" id="deAddVids" accept="video/*" multiple>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" style="flex:1" id="deCancel">取消</button><button class="btn btn-primary" style="flex:1" id="deSave">保存</button></div>`;
  document.getElementById('modalMask').classList.add('show');
  let imgs=(en.imgs||[]).slice(); let vids=(en.videos||[]).slice();
  const renderM=()=>{
    document.getElementById('deImgs').innerHTML=imgs.map((s,i)=>`<div class="me-thumb"><img src="${mediaSrc(s)}"><button class="me-x" data-rmimg="${i}">✕</button></div>`).join('');
    document.getElementById('deVids').innerHTML=vids.map((s,i)=>`<div class="me-thumb"><video src="${mediaSrc(s)}"></video><button class="me-x" data-rmvid="${i}">✕</button></div>`).join('');
  };
  renderM();
  const clo=()=>document.getElementById('modalMask').classList.remove('show');
  document.getElementById('dClose').onclick=clo; document.getElementById('deCancel').onclick=clo;
  document.getElementById('deImgs').addEventListener('click',e=>{ const b=e.target.closest('[data-rmimg]'); if(!b)return; imgs.splice(+b.dataset.rmimg,1); renderM(); });
  document.getElementById('deVids').addEventListener('click',e=>{ const b=e.target.closest('[data-rmvid]'); if(!b)return; vids.splice(+b.dataset.rmvid,1); renderM(); });
  document.getElementById('deAddImgs').onchange=async e=>{ for(const f of e.target.files){ const r=await saveImage(f); if(r) imgs.push(r); } renderM(); };
  document.getElementById('deAddVids').onchange=async e=>{ for(const f of e.target.files){ const s=await saveVideo(f,600); if(s) vids.push(s); } renderM(); };
  document.getElementById('deSave').onclick=()=>{
    const text=document.getElementById('deText').value.trim();
    const old=DB[kind][id];
    (old.imgs||[]).forEach(s=>{ if(imgs.indexOf(s)<0) mediaDelete(s); });
    (old.videos||[]).forEach(s=>{ if(vids.indexOf(s)<0) mediaDelete(s); });
    DB[kind][id]={...old,text,imgs,videos:vids}; save(); clo(); renderDiary(kind); toast('已保存修改');
  };
}

  let imgs=(en&&(en.imgs||[]).slice())||[]; let vids=(en&&(en.vids||[]).slice())||[];
  const renderM=()=>{
    document.getElementById('meImgs').innerHTML=imgs.map((s,i)=>`<div class="me-thumb"><img src="${mediaSrc(s)}"><button class="me-x" data-rmimg="${i}">✕</button></div>`).join('');

  };
  renderM();
  const clo=()=>document.getElementById('modalMask').classList.remove('show');
  document.getElementById('mClose').onclick=clo; document.getElementById('meCancel').onclick=clo;
  document.getElementById('meImgs').addEventListener('click',e=>{ const b=e.target.closest('[data-rmimg]'); if(!b)return; imgs.splice(+b.dataset.rmimg,1); renderM(); });
  document.getElementById('meVids').addEventListener('click',e=>{ const b=e.target.closest('[data-rmvid]'); if(!b)return; vids.splice(+b.dataset.rmvid,1); renderM(); });
  document.getElementById('meAddImgs').onchange=async e=>{ for(const f of e.target.files){ const r=await saveImage(f); if(r) imgs.push(r); } renderM(); };
  document.getElementById('meAddVids').onchange=async e=>{ for(const f of e.target.files){ const s=await saveVideo(f,600); if(s) vids.push(s); } renderM(); };
  document.getElementById('meSave').onclick=()=>{
    const name=document.getElementById('meName').value.trim();
    const text=document.getElementById('meText').value.trim();
    if(isEdit){
      const idx=DB[kind].findIndex(x=>x.id===entryId); if(idx<0) return;
      const old=DB[kind][idx];
      (old.imgs||[]).forEach(s=>{ if(imgs.indexOf(s)<0) mediaDelete(s); });
      (old.vids||[]).forEach(s=>{ if(vids.indexOf(s)<0) mediaDelete(s); });
      DB[kind][idx]={...old,name,text,imgs,vids}; save(); clo(); renderMediaPage(kind); toast('已保存修改');
    } else {
      if(!name&&!text&&!imgs.length&&!vids.length) return toast('请填写名称/心得或上传文件');
      DB[kind].push({id:uid(),name,text,imgs,vids,date:todayStr(),ts:Date.now()}); save(); clo(); renderMediaPage(kind); toast('已发布');
    }
  };
}

const BOOK_CATS = ['文学','英语','小说','励志','经济'];
const BOOK_STATUS = ['未读','在读','已读'];

function renderReadBooks(){
  const books = DB.readBooks || [];
  const unread = books.filter(b=>b.status==='未读');
  const reading = books.filter(b=>b.status==='在读');
  const finished = books.filter(b=>b.status==='已读');

  pagesEl.innerHTML = `

    <button class="add-book-btn" id="openAddBook">+ 添加书籍</button>

    <!-- 统计 -->
    <div class="stat-badges">
      <div class="stat-badge"><div class="num">${unread.length}</div><div class="lab">未读</div></div>
      <div class="stat-badge"><div class="num">${reading.length}</div><div class="lab">在读</div></div>
      <div class="stat-badge"><div class="num">${finished.length}</div><div class="lab">已读</div></div>
    </div>

    <!-- 在读 -->
    ${reading.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📚 在读 (${reading.length}本)</div>
      ${reading.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 未读 -->
    ${unread.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📖 未读 (${unread.length}本)</div>
      ${unread.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 已读 -->
    ${finished.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">✅ 已读 (${finished.length}本)</div>
      ${finished.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    ${!books.length?'<div style="text-align:center;color:var(--text-soft);padding:30px">还没有书籍，点击上方「+ 添加书籍」开始记录吧～</div>':''}

    </div>`;

  document.getElementById('openAddBook').onclick = ()=> showBookModal();

      if(editBtn) showBookModal(editBtn.dataset.edit);
      if(delBtn){
        if(confirm('确定删除这本书吗？')){
          DB.readBooks = DB.readBooks.filter(b=>b.id!==delBtn.dataset.del);
          save(); renderReadBooks(); toast('已删除');
        }
      }
    });
  });
}

function bookCardHTML(b){
  const pct = b.totalPages>0 ? Math.round((b.currentPage||0)/b.totalPages*100) : 0;
  const statusClass = b.status==='未读'?'unread':b.status==='在读'?'reading':'finished';
  return `<div class="book-card">
    <div class="bc-head">
      <div class="bc-cover">📕</div>
      <div class="bc-info">
        <div class="bc-title">${escapeHtml(b.title||'未命名')}</div>
        <div class="bc-author">${escapeHtml(b.author||'未知作者')}</div>
        <div class="bc-meta">
          <span class="bc-tag">${b.category||'未分类'}</span>
          <span class="bc-status ${statusClass}">${b.status}</span>
        </div>
      </div>
    </div>
    <div class="bc-progress"><div class="bc-progress-bar" style="width:${pct}%"></div></div>
    <div class="bc-pages">${b.currentPage||0} / ${b.totalPages||0} 页 · ${pct}%</div>
    ${((b.notes&&b.notes.length)||(b.imgs&&b.imgs.length))?`<div class="bc-extra">📝 ${(b.notes||[]).length} 条心得${(b.imgs&&b.imgs.length)?` · 🖼️ ${b.imgs.length} 张图`:''}</div>`:''}

let _savedRate=[], _savedPlayIdx=null;
function engSavedHTML(saved){
  return `<div class="eng-saved">${saved.map((s,i)=>esLineHTML(s,i)).join('')}</div>`;
}
function esLineHTML(s,i){
  const rate=_savedRate[i]||1; const playing=_savedPlayIdx===i;
  return `<div class="es-line ${playing?'on':''}">
    <div class="es-top"><span class="es-text">${escapeHtml(s)}</span><button class="es-loop" data-splay="${i}" title="${playing?'暂停':'朗读'}">${playing?'⏸️':'▶️'}</button></div>
    <div class="es-bottom">
      <div class="es-rate">${[0.5,0.75,1].map(r=>`<button class="es-rbtn ${r===rate?'on':''}" data-srate="${i}" data-r="${r}">${r}×</button>`).join('')}</div>
      <button class="es-loop" data-sedit="${i}" title="修改">✏️</button>
      <button class="es-loop" data-sdel="${i}" title="删除">✕</button>
    </div>
  </div>`;
}
function renderSaved(){
  const box=document.getElementById('savedBox'); const saved=DB.englishListen.saved||[]; if(!box)return;
  while(_savedRate.length<saved.length) _savedRate.push(1);
  if(_savedRate.length>saved.length){ _savedRate.length=saved.length; if(_savedPlayIdx>=saved.length) _savedPlayIdx=null; }
  box.innerHTML=saved.length? engSavedHTML(saved) : '<div style="text-align:center;color:var(--text-soft);padding:14px">还没有保存的听力文本</div>';
  box.querySelectorAll('[data-srate]').forEach(b=>{ b.onclick=()=>{ _savedRate[+b.dataset.srate]=parseFloat(b.dataset.r); renderSaved(); }; });
  box.querySelectorAll('[data-splay]').forEach(b=>{ b.onclick=()=>toggleSavedPlay(+b.dataset.splay); });
  box.querySelectorAll('[data-sedit]').forEach(b=>{ b.onclick=()=>{
    const i=+b.dataset.sedit; const old=DB.englishListen.saved[i];
    const v=prompt('修改这条听力文本', old); if(v===null) return;
    if(!v.trim()) return toast('内容不能为空');
    DB.englishListen.saved[i]=v.trim(); save(); renderSaved(); toast('已修改');
  }; });
  box.querySelectorAll('[data-sdel]').forEach(b=>{ b.onclick=()=>{
    const i=+b.dataset.sdel; DB.englishListen.saved.splice(i,1); _savedRate.splice(i,1);
    if(_savedPlayIdx===i) _savedPlayIdx=null; else if(_savedPlayIdx>i) _savedPlayIdx--;
    save(); renderSaved();
  }; });
}
function toggleSavedPlay(i){
  const s=DB.englishListen.saved[i]; if(!s) return;
  if(_savedPlayIdx===i){ stopSpeak(); _savedPlayIdx=null; renderSaved(); return; }
  const seq=++_speakSeq;
  _savedPlayIdx=i;
  speechSynthesis.cancel();
  const u=makeUtterance(s, _savedRate[i]||1);
  u.onend=()=>{ if(seq!==_speakSeq) return; _savedPlayIdx=null; renderSaved(); };
  speechSynthesis.speak(u);
  setTts('🔊 朗读中 '+( _savedRate[i]||1)+'× · 点 ⏸️ 可暂停');
  renderSaved();
}
let listening=false, engLoop=false, engFollow=false;
function bindRec(onText){
  document.getElementById('recBtn').onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const isIOS=/iPad|iPhone|iPod/i.test(navigator.userAgent);
    if(!SR){
      document.getElementById('recStatus').textContent = isIOS ? '⚠️ 苹果 Safari 不支持原生语音识别，请在下方手动输入或粘贴英文' : '⚠️ 当前浏览器不支持语音识别，请在下方手动输入';
      toast(isIOS?'iPhone Safari 不支持语音识别，请手动输入':'浏览器不支持语音识别');
      return;
    }
    if(listening){ if(recognition) recognition.stop(); return; }
    recognition=new SR(); recognition.lang='en-US'; recognition.interimResults=false; recognition.continuous=false;
    listening=true; document.getElementById('recBtn').textContent='⏹️ 停止'; document.getElementById('recStatus').textContent='录音中…请说英文';
    recognition.onstart=()=>{ document.getElementById('recStatus').textContent='🎤 录音中，请说话…'; };
    recognition.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; } t=t.trim(); document.getElementById('recBtn').textContent='🎙️ 开始录音'; listening=false; document.getElementById('recStatus').textContent='识别完成 ✓'; if(t) onText(t); };
    recognition.onerror=(ev)=>{ document.getElementById('recBtn').textContent='🎙️ 开始录音'; listening=false; const map={ 'not-allowed':('没有麦克风权限，请在设置里允许'), 'no-speech':'没有听到声音，请靠近麦克风再说', 'network':'网络原因识别失败，请重试' }; document.getElementById('recStatus').textContent='识别失败：'+(map[ev.error]||ev.error||'请重试'); };
    recognition.onend=()=>{ if(listening){ listening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; document.getElementById('recStatus').textContent='识别结束'; } };
    recognition.start();
  };
}
function renderWeakChips(){
  const box=document.getElementById('weakBox'); const weak=DB.englishListen.weak||{}; if(!box)return;
  const wa=Object.keys(weak).sort((a,b)=>weak[b]-weak[a]);
  box.innerHTML=wa.length? `<div>${wa.slice(0,20).map(w=>`<span class="weak-chip" data-word="${w}">${w}<span class="w-count">×${weak[w]}</span></span>`).join('')}</div>` : '<div style="text-align:center;color:var(--text-soft);padding:14px">对话后自动积累，先录一段吧</div>';
  document.querySelectorAll('#weakBox [data-word]').forEach(b=>{ b.onclick=()=>speak(b.dataset.word,0.9); });
}
async function engTranslate(text){
  const hasCJK=/[\u4e00-\u9fa5]/.test(text); if(!hasCJK) return {ok:false,result:text};
  try{ const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN|en'); const j=await r.json(); const t=(j.responseData&&j.responseData.translatedText)||''; if(t) return {ok:true,result:t.trim()}; }catch(e){}
  return {ok:false,result:text};
}
function extractWeak(text){
  const stop=new Set(['the','a','an','is','are','was','were','i','you','he','she','it','we','they','to','of','in','on','at','and','or','for','that','this','with','my','your','his','her','our','their','not','do','does','did','have','has','had','there','be','been','can','could','will','would','should','just','really','so','very','what','when','where','who','how','why','about','because','but','if','then','than','too','also','me','him','them','us','from','as','into','no','yes']);
  return (text.match(/[a-zA-Z']+/g)||[]).map(w=>w.toLowerCase()).filter(w=>w.length>3&&!stop.has(w));
}
async function onSentence(text){
  const ph=document.getElementById('engPhrase'), cor=document.getElementById('engCorrect'), inp=document.getElementById('engInput');
  if(ph) ph.textContent=text; if(inp) inp.value=text;
  const ws=extractWeak(text);
  DB.englishListen.weak=DB.englishListen.weak||{};
  ws.forEach(w=>{ DB.englishListen.weak[w]=(DB.englishListen.weak[w]||0)+1; });
  save();
  const trans=await engTranslate(text);
  if(cor) cor.textContent = trans.ok? ('✔ '+trans.result) : (/[\u4e00-\u9fa5]/.test(text)? '（含中文，联网后可自动翻译）': text);
  DB.englishListen.dialogue.push({role:'you',text,trans:trans.ok?trans.result:''}); save();
  renderWeakChips();
}

/* ================= 工具函数 ================= */
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 实时语音识别用全局 recognition 变量 */

/* TTS 美式发音 + 变速 + 单曲循环 + 跟读 */
let recognition;
let _speakSeq=0;
function setTts(txt){ const el=document.getElementById('ttsState'); if(el) el.textContent=txt; }
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); _speakSeq++; setTts('⏸️ 已停止'); }
function makeUtterance(text, rate){
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate = rate||1;
  // 选美式声音
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang==='en-US' && /Samantha|Google US English|Alex/i.test(v.name)) || voices.find(v=>v.lang==='en-US');
  if(enVoice) u.voice=enVoice;
  return u;
}
function speak(text, rate, loop, follow){
  if(!('speechSynthesis' in window)) return toast('浏览器不支持语音合成');
  speechSynthesis.cancel();
  const seq=++_speakSeq;
  if(follow){
    // 跟读模式：逐句读，每句后停顿相应时间给你跟读，再读下一句
    const sentences = splitSentences(text);
    speakFollow(sentences, rate, seq);
    if(sentences.length) setTts('🗣️ 跟读中…（读一句停一下）');
    return;
  }
  const u = makeUtterance(text, rate);
  if(loop){ u.onend = ()=>{ if(seq!==_speakSeq) return; speechSynthesis.speak(u); }; }
  speechSynthesis.speak(u);
}
/* 跟读：读一句 → 停顿（按该句时长）→ 再读下一句 */
function speakFollow(sentences, rate, seq){
  if(!sentences.length) return;
  const u = makeUtterance(sentences[0], rate);
  u.onend = ()=>{
    if(seq!==_speakSeq) return;
    const gap = followGap(sentences[0], rate);
    setTimeout(()=>{ if(seq!==_speakSeq) return; speakFollow(sentences.slice(1), rate, seq); }, gap);
  };
  speechSynthesis.speak(u);
}
/* 把一段英文拆成句子（按 . ! ? 及换行） */
function splitSentences(text){
  const parts=(text||'').replace(/\s+/g,' ').match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text||''];
  return parts.map(s=>s.trim()).filter(Boolean);
}
/* 估算一句英文的朗读时长（毫秒），用作跟读留白时间 */
function followGap(text, rate){
  const words=(text.match(/[a-zA-Z']+/g)||[]).length;
  const secs=Math.max(words/(2.6*(rate||1)), 1.4);
  return secs*1000;
}
/* 文件下载 */
function downloadFile(name, text){
  const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
}
/* 读取文件为文本 */
function readFileAsText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }
