<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晓昂工作台">
<meta name="theme-color" content="#fdf2f7">
<title>晓昂工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<style>
:root{
  --bg:#fdf6f9;
  --pink:#f7a8c4; --pink-soft:#ffe3ee;
  --peach:#ffc9a8; --peach-soft:#ffeedf;
  --mint:#a8e6cf; --mint-soft:#e0f7ec;
  --lav:#c3b6ff; --lav-soft:#ece8ff;
  --lemon:#ffe08a; --lemon-soft:#fff4cf;
  --sky:#a8d8ff; --sky-soft:#e2f1ff;
  --coral:#ffb3b3; --coral-soft:#ffe5e5;
  --text:#5a4a52; --text-soft:#9a8890;
  --card:#ffffff;
  --radius:20px;
  --shadow:0 6px 20px rgba(230,180,200,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
/* ===== 主布局：左侧导航 + 右侧内容 ===== */
#app{display:flex;height:100%;height:100dvh;}
#sidebar{
  width:86px;min-width:86px;height:100%;
  background:linear-gradient(180deg,#fff5f8,#fbeef5);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:10px;overflow-y:auto;
  box-shadow:2px 0 12px rgba(230,180,200,.15);
  z-index:5;
}
#sidebar .logo{
  width:56px;height:56px;border-radius:18px;
  background:linear-gradient(135deg,var(--pink),var(--lav));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin-bottom:6px;box-shadow:var(--shadow);
}
.nav-item{
  width:66px;height:66px;border-radius:20px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--card);transition:all .18s ease;position:relative;
  box-shadow:0 3px 10px rgba(230,180,200,.15);
}
.nav-item .ico{font-size:26px;line-height:1;}
.nav-item .lb{font-size:9px;color:var(--text-soft);white-space:nowrap;font-weight:500;}
.nav-item.active{transform:scale(1.08);box-shadow:0 6px 16px rgba(230,180,200,.35);}
.nav-item.active .lb{color:var(--text);font-weight:700;}
#main{flex:1;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 通用组件 ===== */
h1.page-title{font-size:24px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px;}
h1.page-title .t-ico{font-size:30px;}
.page-sub{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.btn{
  border:none;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .12s;color:#fff;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--pink),#f48fb1);}
.btn-ghost{background:#f3eef2;color:var(--text);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:11px;}
.btn-block{width:100%;}
textarea,input[type=text],input[type=time],input[type=url],input[type=date]{
  width:100%;border:2px solid #f0e4ea;border-radius:12px;padding:10px 12px;
  font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;
  -webkit-user-select:text;user-select:text;
}
textarea:focus,input:focus{border-color:var(--pink);}
textarea{min-height:80px;resize:vertical;}
label.f-label{font-size:12px;color:var(--text-soft);display:block;margin:10px 0 5px;font-weight:600;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== 打卡页 ===== */
.checklist{display:flex;flex-direction:column;gap:10px;}
.check-item{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(230,180,200,.12);
}
.check-item .c-ico{font-size:24px;}
.check-item .c-name{flex:1;font-size:15px;font-weight:600;}
.check-item .c-time{font-size:11px;color:var(--text-soft);margin-top:2px;}
.check-btn{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
  transition:all .18s;display:flex;align-items:center;justify-content:center;
}
.check-btn.yes{background:var(--mint);color:#fff;}
.check-btn.no{background:var(--coral);color:#fff;}
.check-btn.dim{opacity:.5;}
.check-item.done{background:linear-gradient(135deg,#f0fbf5,#e7f7ee);}
.check-item.done .c-name{color:#6aa988;}
.check-item .done-badge{font-size:18px;}

/* ===== 日历（古筝/运动互通） ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .mon{font-size:17px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-grid .wd{font-size:11px;color:var(--text-soft);font-weight:700;padding:4px 0;}
.cal-cell{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;
  cursor:pointer;background:#fbf6f8;transition:transform .12s;
}
.cal-cell:active{transform:scale(.92);}
.cal-cell .dn{font-size:13px;}
.cal-cell .dot{width:8px;height:8px;border-radius:50%;position:absolute;top:6px;right:6px;}
.cal-cell.today{outline:2px solid var(--pink);}
.cal-cell.empty{background:transparent;cursor:default;}
.cal-cell.zhou{background:var(--pink);color:#fff;}
.cal-cell.yun{background:var(--sky);color:#fff;}
.cal-cell.both{background:linear-gradient(135deg,var(--pink),var(--sky));color:#fff;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-soft);margin:10px 0;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .sw{width:14px;height:14px;border-radius:5px;display:inline-block;}

/* ===== 心得/媒体卡片 ===== */
.note-item{background:#fbf6f8;border-radius:14px;padding:12px;margin-bottom:10px;}
.note-item .n-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.note-item .n-date{font-size:11px;color:var(--text-soft);}
.note-item .n-text{font-size:14px;white-space:pre-wrap;line-height:1.6;}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.media-grid img,.media-grid video{width:100%;border-radius:10px;object-fit:cover;background:#eee;}
.media-grid video{max-height:90px;}
.del-btn{background:none;border:none;color:#e0809a;font-size:12px;cursor:pointer;}
.book-list{margin-top:8px;}
.book-item{display:flex;align-items:center;gap:8px;background:#fbf6f8;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;}

/* ===== 英语 ===== */
.eng-box{background:#f6f2ff;border-radius:14px;padding:14px;}
.eng-phrase{font-size:20px;font-weight:700;margin:8px 0;color:#6a5bbf;}
.speed-row{display:flex;gap:8px;margin-top:10px;}
.speed-btn{flex:1;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--text);}
.speed-btn.on{background:var(--lav);color:#fff;}

/* ===== 时间标注 ===== */
.time-set{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.time-set input{width:auto;flex:1;}

/* ===== 计划表 ===== */
.plan-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;margin-bottom:8px;box-shadow:0 3px 8px rgba(230,180,200,.12);}
.plan-time{font-weight:800;font-size:15px;min-width:86px;color:#fff;padding:6px 10px;border-radius:10px;text-align:center;}
.plan-ico{font-size:22px;}
.plan-name{flex:1;font-size:15px;font-weight:600;}
.plan-tag{font-size:11px;color:var(--text-soft);}

/* toast */
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:#5a4a52;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(90,74,82,.4);display:none;align-items:flex-end;z-index:50;}
.modal-mask.show{display:flex;}
.modal{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;animation:up .25s;}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.modal .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main">
    <!-- 页面容器由 JS 渲染 -->
    <div id="pages"></div>
  </main>
</div>
<div id="toast"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBody"></div></div>

<script>
/* ================= 数据模型 ================= */
const CATS = [
  {id:'daka',     name:'每日打卡', emoji:'✅', color:'pink',  soft:'pink'},
  {id:'guzheng',  name:'古筝',     emoji:'🪕', color:'lav',   soft:'lav'},
  {id:'sport',    name:'运动',     emoji:'🏃', color:'sky',   soft:'sky'},
  {id:'inspire',  name:'选题灵感', emoji:'💡', color:'lemon', soft:'lemon'},
  {id:'read',     name:'读书',     emoji:'📖', color:'mint',  soft:'mint'},
  {id:'craft',    name:'手工',     emoji:'🧶', color:'peach', soft:'peach'},
  {id:'english',  name:'英语学习', emoji:'🗣️', color:'coral', soft:'coral'},
  {id:'outfit',   name:'穿搭',     emoji:'👗', color:'pink',  soft:'pink'},
];
// 打卡的 7 个任务（对应类别 2-8）
const CHECK_TASKS = [
  {id:'guzheng', name:'古筝',     emoji:'🪕'},
  {id:'sport',   name:'运动',     emoji:'🏃'},
  {id:'inspire', name:'选题灵感', emoji:'💡'},
  {id:'read',    name:'读书',     emoji:'📖'},
  {id:'craft',   name:'手工',     emoji:'🧶'},
  {id:'english', name:'英语学习', emoji:'🗣️'},
  {id:'outfit',  name:'穿搭',     emoji:'👗'},
];

const COLOR_MAP = {
  pink:'#f7a8c4', lav:'#c3b6ff', sky:'#a8d8ff', lemon:'#ffe08a',
  mint:'#a8e6cf', peach:'#ffc9a8', coral:'#ffb3b3'
};

const DEFAULT_DATA = {
  checks:{},          // { '2026-09-03': {guzheng:true, sport:true, ...} }
  guzheng:{},         // { '2026-09-03': {note:'', videos:[...] } }
  sport:{},
  inspire:{},         // { id: {date, text, imgs:[]} } 或按日期
  read:{},            // { id: {date, text, imgs:[], book:''} }
  craft:{},
  english:{},
  outfit:{},
  books:[],           // 预留书名 [{id,name}]
  times:{},           // { read:'07:00-08:00', ... }
  plan:[]             // 不存，动态生成
};
let DB = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem('xiaoang_v1')); return d?deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)),d):JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function deepMerge(base,src){ for(const k in src){ if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])){ base[k]=base[k]||{}; deepMerge(base[k],src[k]); } else base[k]=src[k]; } return base; }
function save(){ localStorage.setItem('xiaoang_v1', JSON.stringify(DB)); }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= 导航渲染 ================= */
const sidebar = document.getElementById('sidebar');
sidebar.innerHTML = '<div class="logo">🌸</div>' + CATS.map(c=>`
  <button class="nav-item" data-id="${c.id}" title="${c.name}">
    <span class="ico">${c.emoji}</span><span class="lb">${c.name}</span>
  </button>`).join('') + `
  <button class="nav-item" data-id="plan" title="计划表">
    <span class="ico">📋</span><span class="lb">计划表</span>
  </button>
  <button class="nav-item" data-id="time" title="设置时间">
    <span class="ico">🕐</span><span class="lb">设置时间</span>
  </button>`;
sidebar.addEventListener('click', e=>{
  const btn = e.target.closest('.nav-item'); if(!btn) return;
  switchPage(btn.dataset.id);
});

let currentPage = 'daka';
function switchPage(id){
  currentPage = id;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  if(id==='plan'){ renderPlan(); return; }
  if(id==='time'){ renderTimePage(); return; }
  renderPage(id);
}

/* ================= 页面渲染 ================= */
const pagesEl = document.getElementById('pages');
function renderPage(id){
  switch(id){
    case 'daka': renderDaka(); break;
    case 'guzheng': renderCal('guzheng'); break;
    case 'sport': renderCal('sport'); break;
    case 'inspire': renderDiary('inspire'); break;
    case 'read': renderDiary('read'); break;
    case 'craft': renderDiary('craft'); break;
    case 'english': renderEnglish(); break;
    case 'outfit': renderDiary('outfit'); break;
  }
}

/* ---------- 每日打卡 ---------- */
function renderDaka(){
  const t = todayStr();
  const checks = DB.checks[t] || {};
  const doneCount = CHECK_TASKS.filter(x=>checks[x.id]).length;
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">✅</span>每日打卡</h1>
    <div class="page-sub">${t} · 已完成 ${doneCount}/${CHECK_TASKS.length}</div>
    <div class="checklist">
      ${CHECK_TASKS.map(task=>{
        const done = !!checks[task.id];
        return `<div class="check-item ${done?'done':''}" data-id="${task.id}">
          <span class="c-ico">${task.emoji}</span>
          <div style="flex:1"><div class="c-name">${task.name}</div>
            ${DB.times[task.id]?`<div class="c-time">🕐 ${DB.times[task.id]}</div>`:''}
          </div>
          ${done
            ? `<span class="done-badge">✅</span><button class="check-btn dim" data-act="reset">↩️</button>`
            : `<button class="check-btn yes" data-act="yes">✓</button>
               <button class="check-btn no" data-act="no">✗</button>`}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-ghost btn-block" onclick="switchPage('plan')">📋 查看今日计划表</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="switchPage('time')">🕐 设置时间段</button>
    </div>`;
  pagesEl.querySelectorAll('.check-item').forEach(item=>{
    item.addEventListener('click', e=>{
      const act = e.target.closest('[data-act]')?.dataset.act;
      const id = item.dataset.id;
      if(!act) return;
      DB.checks[t] = DB.checks[t] || {};
      if(act==='yes'){ DB.checks[t][id]=true; toast('已打卡 '+item.querySelector('.c-name').textContent+' ✓'); }
      else if(act==='no'){ toast('未完成 '+(item.querySelector('.c-name').textContent)); }
      else { DB.checks[t][id]=false; }
      save(); renderDaka();
    });
  });
}

/* ---------- 互通日历（古筝/运动） ---------- */
let calView = {year:null, month:null};
function renderCal(kind){
  const now = new Date();
  if(!calView.year){ calView.year=now.getFullYear(); calView.month=now.getMonth(); }
  const y=calView.year, m=calView.month;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const isCur = y===now.getFullYear() && m===now.getMonth();
  const title = kind==='guzheng'?'古筝':'运动';
  const emoji = kind==='guzheng'?'🪕':'🏃';
  const color = kind==='guzheng'?'pink':'sky';

  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const z = DB.guzheng[ds]?.done, u = DB.sport[ds]?.done;
    let cls='', txt=d;
    if(z&&u) cls='both';
    else if(kind==='guzheng' && z) cls='zhou';
    else if(kind==='sport' && u) cls='yun';
    else if(kind==='guzheng' && u) cls='yun';  // 互通：运动打卡在古筝日历也可见
    else if(kind==='sport' && z) cls='zhou';
    // 当天高亮
    const isToday = isCur && d===now.getDate();
    cells+=`<div class="cal-cell ${cls} ${isToday?'today':''}" data-ds="${ds}">${d}</div>`;
  }
  const monLabel = `${y}年${m+1}月`;
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">${emoji}</span>${title}</h1>
    <div class="page-sub">${kind==='guzheng'?'与「运动」日历互通 · 点击日期打卡/写心得':'与「古筝」日历互通 · 点击日期打卡/写心得'}</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="prevM">‹ 上月</button>
        <div class="mon">${monLabel}</div>
        <button class="btn btn-ghost btn-sm" id="nextM">› 下月</button>
      </div>
      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><span class="sw" style="background:${COLOR_MAP.pink}"></span>古筝打卡</span>
        <span><span class="sw" style="background:${COLOR_MAP.sky}"></span>运动打卡</span>
        <span><span class="sw" style="background:linear-gradient(135deg,${COLOR_MAP.pink},${COLOR_MAP.sky})"></span>均打卡</span>
      </div>
    </div>
    <div class="card">
      <h3>📅 选中日期详情</h3>
      <div id="dayDetail">请点击上方日期查看</div>
    </div>`;
  document.getElementById('prevM').onclick=()=>{ calView.month--; if(calView.month<0){calView.month=11;calView.year--;} renderCal(kind); };
  document.getElementById('nextM').onclick=()=>{ calView.month++; if(calView.month>11){calView.month=0;calView.year++;} renderCal(kind); };
  pagesEl.querySelectorAll('.cal-cell:not(.empty)').forEach(c=>{
    c.onclick=()=>showDayDetail(c.dataset.ds, kind);
  });
}

function showDayDetail(ds, kind){
  const z = DB.guzheng[ds]||{done:false,note:'',videos:[]};
  const u = DB.sport[ds]||{done:false,note:'',videos:[]};
  const detail = document.getElementById('dayDetail');
  if(!detail) return;
  detail.innerHTML = `
    <div style="font-weight:700;margin-bottom:10px">${ds}</div>
    <div class="chip-row" style="margin-bottom:10px">
      <button class="btn btn-sm ${z.done?'':'btn-ghost'}" style="${z.done?'background:'+COLOR_MAP.pink:''}" id="togZ">🪕 古筝 ${z.done?'已打卡':'未打卡'}</button>
      <button class="btn btn-sm ${u.done?'':'btn-ghost'}" style="${u.done?'background:'+COLOR_MAP.sky:''}" id="togU">🏃 运动 ${u.done?'已打卡':'未打卡'}</button>
    </div>
    <label class="f-label">写心得</label>
    <textarea id="dayNote" placeholder="记录今天的心得…">${(kind==='guzheng'?z.note:u.note)||''}</textarea>
    <label class="f-label">上传视频</label>
    <input type="file" id="dayVideo" accept="video/*" multiple>
    <div class="media-grid" id="dayVideos">
      ${(kind==='guzheng'?z.videos:u.videos).map(v=>`<video src="${v}" controls></video>`).join('')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" id="saveDay">保存</button>`;

  // 视频：转 base64 存 localStorage（小视频）
  document.getElementById('dayVideo').addEventListener('change', async e=>{
    const kind2 = kind;
    const rec = DB[kind2][ds]||(DB[kind2][ds]={done:false,note:'',videos:[]});
    for(const f of e.target.files){
      if(f.size > 8*1024*1024){ toast('视频太大(>8MB)，请压缩'); continue; }
      const data = await fileToDataURL(f);
      rec.videos.push(data);
    }
    save(); showDayDetail(ds,kind2); toast('视频已上传');
  });

  document.getElementById('togZ').onclick=()=>{
    DB.guzheng[ds]=DB.guzheng[ds]||{done:false,note:'',videos:[]};
    DB.guzheng[ds].done=!DB.guzheng[ds].done;
    // 互通：同步到每日打卡
    if(DB.guzheng[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].guzheng=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('togU').onclick=()=>{
    DB.sport[ds]=DB.sport[ds]||{done:false,note:'',videos:[]};
    DB.sport[ds].done=!DB.sport[ds].done;
    if(DB.sport[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].sport=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('saveDay').onclick=()=>{
    const rec = DB[kind][ds]||(DB[kind][ds]={done:false,note:'',videos:[]});
    rec.note = document.getElementById('dayNote').value;
    save(); toast('心得已保存'); showDayDetail(ds,kind);
  };
}

/* ---------- 通用日记/上传页（灵感/读书/手工/穿搭） ---------- */
function renderDiary(kind){
  const cfg = {
    inspire:{emoji:'💡',name:'选题灵感',color:'lemon',allowImg:true,allowVideo:false,allowBook:false},
    read:{emoji:'📖',name:'读书',color:'mint',allowImg:true,allowVideo:false,allowBook:true},
    craft:{emoji:'🧶',name:'手工',color:'peach',allowImg:true,allowVideo:true,allowBook:false},
    outfit:{emoji:'👗',name:'穿搭',color:'pink',allowImg:true,allowVideo:false,allowBook:false},
  }[kind];
  const entries = Object.values(DB[kind]||{}).sort((a,b)=>(b.date||0)-(a.date||0));
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">${cfg.emoji}</span>${cfg.name}</h1>
    <div class="page-sub">记录图片、视频与心得</div>
    <div class="card">
      <h3>✍️ 写心得</h3>
      <textarea id="newNote" placeholder="写点今天的心得…"></textarea>
      ${cfg.allowBook?`
        <label class="f-label">📚 预留书名</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="newBook" placeholder="输入书名并添加到书单">
          <button class="btn btn-ghost btn-sm" id="addBook">添加</button>
        </div>
        <div class="book-list" id="bookList"></div>`:''}
      ${cfg.allowImg?`<label class="f-label">🖼️ 上传图片</label><input type="file" id="newImgs" accept="image/*" multiple>`:''}
      ${cfg.allowVideo?`<label class="f-label">🎬 上传视频</label><input type="file" id="newVideos" accept="video/*" multiple>`:''}
      <button class="btn btn-primary btn-block" style="margin-top:14px" id="saveEntry">发布</button>
    </div>
    <div id="entries">${entries.map(en=>entryHTML(en,cfg)).join('')||'<div style="text-align:center;color:var(--text-soft);padding:20px">还没有记录哦～</div>'}</div>`;

  // 书名
  if(cfg.allowBook){
    const bl = document.getElementById('bookList');
    const renderBooks=()=>{ bl.innerHTML = DB.books.map(b=>`<div class="book-item"><span>📕</span><span style="flex:1">${escapeHtml(b.name)}</span><button class="del-btn" data-bid="${b.id}">删除</button></div>`).join(''); };
    renderBooks();
    document.getElementById('addBook').onclick=()=>{
      const v=document.getElementById('newBook').value.trim(); if(!v) return toast('请输入书名');
      DB.books.push({id:uid(),name:v}); save(); document.getElementById('newBook').value=''; renderBooks(); toast('已加入书单');
    };
    bl.addEventListener('click',e=>{
      const d=e.target.closest('[data-bid]'); if(!d) return;
      DB.books=DB.books.filter(b=>b.id!==d.dataset.bid); save(); renderBooks();
    });
  }

  // 发布新记录
  document.getElementById('saveEntry').onclick=async()=>{
    const text = document.getElementById('newNote').value.trim();
    const imgs=[], videos=[];
    if(document.getElementById('newImgs')){ for(const f of document.getElementById('newImgs').files){ if(f.size>8*1024*1024){toast('图片太大');continue;} imgs.push(await fileToDataURL(f)); } }
    if(document.getElementById('newVideos')){ for(const f of document.getElementById('newVideos').files){ if(f.size>8*1024*1024){toast('视频太大(>8MB)');continue;} videos.push(await fileToDataURL(f)); } }
    if(!text && !imgs.length && !videos.length) return toast('请先填写心得或上传文件');
    DB[kind]=DB[kind]||{};
    const id=uid();
    DB[kind][id]={id,date:todayStr(),ts:Date.now(),text,imgs,videos};
    save(); renderDiary(kind); toast('已发布');
  };
  // 删除
  pagesEl.querySelector('#entries').addEventListener('click',e=>{
    const d=e.target.closest('[data-del]'); if(!d) return;
    delete DB[kind][d.dataset.del]; save(); renderDiary(kind);
  });
}

function entryHTML(en,cfg){
  const media='';
  const imgs = (en.imgs||[]).map(s=>`<img src="${s}">`).join('');
  const vids = (en.videos||[]).map(s=>`<video src="${s}" controls></video>`).join('');
  return `<div class="note-item">
    <div class="n-head"><span class="n-date">${en.date}</span><button class="del-btn" data-del="${en.id}">删除</button></div>
    ${en.text?`<div class="n-text">${escapeHtml(en.text)}</div>`:''}
    ${(imgs||vids)?`<div class="media-grid">${imgs}${vids}</div>`:''}
  </div>`;
}

/* ---------- 英语 ---------- */
let engRate = 1;
function renderEnglish(){
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">🗣️</span>英语学习</h1>
    <div class="page-sub">说出英语 → 提取语句 → 美式配音变速跟读</div>
    <div class="card eng-box">
      <h3>🎤 口语输入</h3>
      <button class="btn btn-primary btn-block" id="recBtn">🎙️ 开始录音</button>
      <div id="recStatus" style="font-size:12px;color:var(--text-soft);margin-top:8px">点击按钮后对着麦克风说英文，说完再点一次停止</div>
      <label class="f-label">识别到的语句</label>
      <div class="eng-phrase" id="engPhrase">（尚未识别）</div>
      <label class="f-label">也可以手动输入语句</label>
      <textarea id="engInput" placeholder="手动输入英文句子…"></textarea>
    </div>
    <div class="card">
      <h3>🔊 美式配音 · 变速跟读</h3>
      <div class="speed-row">
        ${[0.5,0.75,1,1.5].map(r=>`<button class="speed-btn ${r===engRate?'on':''}" data-rate="${r}">${r}×</button>`).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px" id="speakBtn">▶️ 播放配音</button>
    </div>`;
  // 录音：实时识别
  let isListening=false;
  document.getElementById('recBtn').onclick=()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('当前浏览器不支持语音识别，请手动输入'); return; }
    if(isListening){ if(recognition) recognition.stop(); return; }
    recognition = new SR();
    recognition.lang='en-US';
    recognition.interimResults=false;
    recognition.continuous=false;
    isListening=true;
    document.getElementById('recBtn').textContent='⏹️ 停止录音';
    document.getElementById('recStatus').textContent='录音中…请说英文';
    recognition.onresult=e=>{
      const text=e.results[0][0].transcript;
      document.getElementById('engPhrase').textContent=text;
      document.getElementById('engInput').value=text;
      document.getElementById('recStatus').textContent='识别完成 ✓';
      isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音';
    };
    recognition.onerror=()=>{ document.getElementById('recStatus').textContent='识别失败，请重试或手动输入'; isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; };
    recognition.onend=()=>{ if(isListening){ isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; } };
    recognition.start();
  };
  // 变速
  pagesEl.querySelectorAll('.speed-btn').forEach(b=>{
    b.onclick=()=>{ engRate=parseFloat(b.dataset.rate); renderEnglish(); };
  });
  // 播放
  document.getElementById('speakBtn').onclick=()=>{
    let text = document.getElementById('engInput').value.trim() || document.getElementById('engPhrase').textContent;
    if(text==='（尚未识别）'||!text) return toast('请先输入或识别语句');
    speak(text, engRate);
  };
}

/* ================= 工具函数 ================= */
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 实时语音识别用全局 recognition 变量 */

/* TTS 美式发音 + 变速 */
function speak(text, rate){
  if(!('speechSynthesis' in window)) return toast('浏览器不支持语音合成');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate = rate;
  // 选美式声音
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang==='en-US' && /Samantha|Google US English|Alex/i.test(v.name)) || voices.find(v=>v.lang==='en-US');
  if(enVoice) u.voice=enVoice;
  speechSynthesis.speak(u);
}
