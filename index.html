<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晓昂工作台">
<meta name="theme-color" content="#f7fbf9">
<title>晓昂工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<style>
@font-face{
  font-family:'ZCOOL KuaiLe';
  src:url('./zcool-kuaile.ttf') format('truetype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#f5efe6;
  /* 奶咖/浅棕系色板 */
  --cream:#f9f4ec;     --cream-soft:#fffbf5;
  --latte:#e8d5c4;     --latte-soft:#f2e6da;
  --cocoa:#c4a882;     --cocoa-soft:#e2d4c0;
  --mocha:#8b6f4e;     --mocha-soft:#c9b59a;
  --walnut:#6b4f3a;    --walnut-soft:#a68b76;
  --honey:#e6c88a;     --honey-soft:#f2e0b8;
  --sage:#a8b89a;      --sage-soft:#d4dcc8;
  --rose:#d4a5a5;      --rose-soft:#eed4d4;
  --sky:#a8c4d4;       --sky-soft:#d4e2ec;
  --text:#5c4a3a;      --text-soft:#9a8a7a;
  --card:#fffbf7;
  --sel-bg:#dcc9ec;    --sel-text:#5a4a6a;   /* 首页日历选中底纹 */
  --radius:22px;
  /* 轻黏土质感：凸起 = 顶部白高光 + 底部半透明厚度 + 柔投影 */
  --clay:       inset 0 2px 3px rgba(255,255,255,.85), inset 0 -3px 5px rgba(0,0,0,.06), 0 5px 0 rgba(0,0,0,.07), 0 9px 18px rgba(140,120,100,.18);
  --clay-soft:  inset 0 2px 3px rgba(255,255,255,.9),  inset 0 -2px 4px rgba(0,0,0,.05), 0 3px 0 rgba(0,0,0,.05), 0 6px 12px rgba(140,120,100,.14);
  --clay-card:  inset 0 2px 3px rgba(255,255,255,.9),  0 5px 16px rgba(140,120,100,.14);
  --clay-press: inset 0 3px 6px rgba(0,0,0,.12), inset 0 1px 2px rgba(0,0,0,.06), 0 1px 0 rgba(0,0,0,.06);
  --clay-inset: inset 0 2px 5px rgba(0,0,0,.07), inset 0 1px 2px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:break-word;}
button,input,select,textarea{font-family:inherit;letter-spacing:0;}
html,body{height:100%;}
body{
  font-family:"ZCOOL KuaiLe","YouYuan","幼圆","PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden; line-height:1.4;
  -webkit-user-select:none;user-select:none;
}

/* ===== 主布局 ===== */
#app{display:flex;height:100%;height:100dvh;}
#sidebar{
  width:92px;min-width:92px;height:100%;
  background:linear-gradient(180deg,#ede5da,#e2d8cb);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:11px;overflow-y:auto;
  box-shadow:inset -2px 0 3px rgba(255,255,255,.5), 4px 0 16px rgba(120,100,80,.15);
  z-index:5;
}
#sidebar .logo{
  width:60px;height:60px;border-radius:22px;
  background:linear-gradient(145deg,#f2e6da,#d4b896);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin-bottom:8px;
  box-shadow:var(--clay);
  position:relative;
}
#sidebar .logo::after{
  content:'';position:absolute;inset:5px 5px auto auto;
  width:16px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.7) 0%,transparent 72%);
  pointer-events:none;
}
.nav-item{
  width:70px;height:70px;border-radius:23px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  transition:all .14s ease;position:relative;
  box-shadow:var(--clay-soft);
  color:var(--text);font-family:inherit;
}
.nav-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:13px;height:7px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.nav-item .ico{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.06));
}
.nav-item .ico svg{width:42px;height:42px;}
.nav-item .ico img{width:42px;height:42px;}
.nav-item .lb{font-size:9.5px;color:var(--text-soft);white-space:nowrap;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.nav-item.active{
  transform:translateY(2px);
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  box-shadow:var(--clay-press);
}
.nav-item.active::after{opacity:.4;}
.nav-item.active .lb{color:#6b4f3a;font-weight:800;}
#main{flex:1;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 通用组件 ===== */
h1.page-title{font-size:24px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px;}
h1.page-title .t-ico{
  font-size:28px;display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:18px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-soft);
}
.page-sub{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
.card{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:var(--radius);
  box-shadow:var(--clay-card);
  padding:16px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* 轻黏土按钮：凸起 + 按下凹陷 */
.btn{
  border:none;border-radius:16px;padding:11px 18px;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .12s ease;color:#fff;
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  box-shadow:var(--clay);
  font-family:inherit;position:relative;
  text-shadow:0 1px 1px rgba(0,0,0,.08);
}
.btn::after{
  content:'';position:absolute;inset:3px 4px auto auto;
  width:34%;height:7px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.5) 0%,transparent 70%);
  pointer-events:none;
}
.btn:active{transform:translateY(3px);box-shadow:var(--clay-press);}
.btn-primary{background:linear-gradient(145deg,#e8d5c4,#c4a882);}
.btn-ghost{
  background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text);
  box-shadow:var(--clay-soft);text-shadow:none;
}
.btn-sm{padding:8px 13px;font-size:12px;border-radius:14px;}
.btn-block{width:100%;}

textarea,input[type=text],input[type=time],input[type=url],input[type=date]{
  width:100%;border:none;border-radius:14px;padding:11px 13px;
  font-size:14px;font-family:inherit;color:var(--text);
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-inset);outline:none;
  -webkit-user-select:text;user-select:text;
}
textarea:focus,input:focus{
  box-shadow:var(--clay-inset),0 0 0 2px rgba(196,168,130,.45);
}
textarea{min-height:80px;resize:vertical;}
label.f-label{font-size:12px;color:var(--text-soft);display:block;margin:10px 0 5px;font-weight:700;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== 打卡页 ===== */
.checklist{display:flex;flex-direction:column;gap:12px;}
.check-item{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  border-radius:20px;padding:12px 14px;
  box-shadow:var(--clay-card);position:relative;
}
.check-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:54px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.check-item .c-ico{
  font-size:24px;width:46px;height:46px;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-soft);
}
.check-item .c-name{flex:1;font-size:15px;font-weight:700;}
.check-item .c-time{font-size:11px;color:var(--text-soft);margin-top:2px;}
.check-btn{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
  transition:all .15s;display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-weight:700;
}
.check-btn.yes{background:linear-gradient(145deg,#c4a882,#a08060);color:#fff;box-shadow:var(--clay);}
.check-btn.no{background:linear-gradient(145deg,#e8d5c4,#c9a890);color:#fff;box-shadow:var(--clay);}
.check-btn.dim{opacity:.45;box-shadow:var(--clay-soft);}
.check-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.check-item.done{background:linear-gradient(145deg,#f0e8dc,#e2d4c0);}
.check-item.done .c-name{color:#6b4f3a;}
.check-item.done .c-ico{background:linear-gradient(145deg,#e8d5c4,#c4a882);}
.check-item.done::after{opacity:.5;}
.done-badge{font-size:20px;}

/* ===== 日历 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .mon{font-size:17px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal-grid .wd{font-size:11px;color:var(--text-soft);font-weight:700;padding:4px 0;}
.cal-cell{
  aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:14px;font-weight:700;
  position:relative;cursor:pointer;background:linear-gradient(145deg,#ffffff,#f1f7f3);color:var(--text);
  box-shadow:var(--clay-soft);transition:all .12s;
}
.cal-cell::after{
  content:'';position:absolute;inset:3px 3px auto auto;
  width:16px;height:6px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.cal-cell:active{transform:translateY(1px);box-shadow:var(--clay-press);}
.cal-cell .dn{font-size:13px;}
.cal-cell.today{background:var(--sel-bg) !important;color:var(--sel-text) !important;outline:2px solid rgba(140,120,100,.28);outline-offset:-4px;}
.cal-cell.empty{background:transparent;cursor:default;box-shadow:none;}
.cal-cell.empty::after{display:none;}
.cal-cell.zhou{background:linear-gradient(145deg,#f0e8dc,#e2d4c0);color:#6b4f3a;}
.cal-cell.yun{background:linear-gradient(145deg,#d4e2ec,#a8c4d4);color:#3a5a6a;}
.cal-cell.both{background:linear-gradient(145deg,#e2d4c0,#a8c4d4);color:#fff;}
.cal-cell.some{background:linear-gradient(145deg,#f0e8dc,#c4a882);color:#5c4a3a;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-soft);margin:10px 0;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:5px;font-weight:600;}
.legend .sw{width:14px;height:14px;border-radius:6px;display:inline-block;box-shadow:var(--clay-soft);}
.sel-color-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;font-size:12px;color:var(--text-soft);font-weight:600;}
.sel-color-row .sc-label{display:flex;align-items:center;gap:6px;}
.sel-color-row input[type="color"]{width:44px;height:30px;border:none;border-radius:9px;background:transparent;box-shadow:var(--clay-inset);cursor:pointer;padding:0;}

/* ===== 全部日历 · 单日汇总 ===== */
.summ-head{display:flex;align-items:center;justify-content:space-between;}
.summ-row{
  margin-bottom:10px;border-radius:18px;
  background:linear-gradient(145deg,#ffffff,#f4f9f6);
  padding:11px 13px;box-shadow:var(--clay-soft);
  border-left:5px solid var(--cc,var(--mint));
  position:relative;
}
.summ-tag{display:flex;align-items:center;gap:10px;}
.summ-ico{
  width:36px;height:36px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:var(--clay-soft);
}
.summ-name{font-weight:700;font-size:14px;}
.summ-time{font-size:11px;color:var(--text-soft);margin-top:2px;}
.summ-status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 11px;border-radius:11px;box-shadow:var(--clay-soft);}
.summ-status.done{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#5c4a3a;}
.summ-status.none{background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text-soft);}
.summ-content{margin-top:8px;padding-left:46px;}
.summ-entry{margin-bottom:8px;}
.summ-text{font-size:13px;line-height:1.6;white-space:pre-wrap;background:#fff;border-radius:12px;padding:8px 11px;margin-bottom:6px;box-shadow:var(--clay-inset);}
.summ-media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;}
.summ-media img,.summ-media video{width:100%;border-radius:10px;object-fit:cover;background:#eee;max-height:90px;box-shadow:var(--clay-soft);}
.summ-plan{font-size:13px;margin-bottom:6px;display:flex;align-items:center;}

/* ===== 心得/媒体卡片 ===== */
.note-item{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:18px;padding:13px;margin-bottom:11px;
  box-shadow:var(--clay-card);position:relative;
}
.note-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:50px;height:8px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,transparent 72%);
  pointer-events:none;
}
.note-item .n-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.note-item .n-date{font-size:11px;color:var(--text-soft);}
.note-item .n-text{font-size:14px;white-space:pre-wrap;line-height:1.6;}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.media-grid img,.media-grid video{width:100%;border-radius:11px;object-fit:cover;background:#eee;box-shadow:var(--clay-soft);}
.media-grid video{max-height:90px;}
.del-btn{
  background:linear-gradient(145deg,#ffffff,#f5efe6);border:none;color:#a06060;
  font-size:11px;cursor:pointer;padding:5px 11px;border-radius:10px;
  box-shadow:var(--clay-soft);font-weight:700;
}
.del-btn:active{transform:translateY(1px);box-shadow:var(--clay-press);}
/* 古筝曲谱（单曲目多图） */
.score-item{background:linear-gradient(145deg,#fff,#f9f4ec);border-radius:18px;padding:13px;box-shadow:var(--clay-card);margin-bottom:10px;}
.score-item .si-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.score-item .si-title{font-weight:800;font-size:15px;color:var(--text);}
.score-item .si-count{font-size:11px;color:var(--text-soft);background:linear-gradient(145deg,#f0eaf7,#e0d0ef);padding:3px 9px;border-radius:9px;font-weight:700;box-shadow:var(--clay-soft);}
.score-item .si-meta{font-size:11px;color:var(--text-soft);margin-bottom:8px;}
.score-item .si-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.scr-thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#f0eaf7;box-shadow:var(--clay-soft);}
.scr-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.scr-thumb iframe{width:100%;height:100%;border:none;background:#fff;}
.score-item .si-more{aspect-ratio:3/4;border-radius:10px;background:linear-gradient(145deg,#d9c9ec,#c4a882);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:var(--clay-soft);}
.score-item .si-empty{font-size:12px;color:var(--text-soft);background:#f0eaf7;border-radius:10px;padding:12px;text-align:center;margin-bottom:8px;box-shadow:var(--clay-inset);}
.score-item .si-actions{display:flex;gap:8px;}
.score-item .si-actions .btn{flex:1;}
.book-list{margin-top:8px;}
.book-item{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:14px;padding:9px 11px;margin-bottom:6px;font-size:13px;
  box-shadow:var(--clay-soft);
}

/* ===== 英语 ===== */
.eng-box{background:linear-gradient(145deg,#f5efe6,#e2d4c0);border-radius:18px;padding:14px;box-shadow:var(--clay-inset);}
.eng-phrase{
  font-size:20px;font-weight:700;margin:8px 0;color:#6b4f3a;
  background:#fff;border-radius:14px;padding:12px;box-shadow:var(--clay-inset);
}
.speed-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.speed-btn{
  flex:1;min-width:56px;border:none;border-radius:14px;padding:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text);
  box-shadow:var(--clay-soft);font-family:inherit;
}
.speed-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.speed-btn.on{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;box-shadow:var(--clay-press);}

/* ===== 时间标注 ===== */
.time-set{
  display:flex;align-items:center;gap:8px;margin-bottom:9px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:14px;padding:9px 11px;box-shadow:var(--clay-soft);
}
.time-set input{width:auto;flex:1;}

/* ===== 计划表 ===== */
.plan-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:9px;
  box-shadow:var(--clay-card);position:relative;
}
.plan-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:46px;height:8px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,transparent 72%);
  pointer-events:none;
}
.plan-time{
  font-weight:800;font-size:14px;min-width:82px;color:#fff;
  padding:7px 10px;border-radius:12px;text-align:center;
  box-shadow:var(--clay-soft);text-shadow:0 1px 1px rgba(0,0,0,.08);
}
.plan-ico{
  font-size:22px;width:40px;height:40px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ffffff,#ecf3ee);box-shadow:var(--clay-soft);
}
.plan-name{flex:1;font-size:15px;font-weight:700;}
.plan-tag{font-size:11px;color:var(--text-soft);font-weight:600;}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(145deg,#8b6f4e,#6b4f3a);color:#fff;
  padding:11px 20px;border-radius:18px;font-size:13px;font-weight:600;
  opacity:0;transition:all .3s;z-index:99;pointer-events:none;
  box-shadow:var(--clay);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Modal ===== */
.modal-mask{
  position:fixed;inset:0;background:rgba(92,74,58,.4);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;z-index:50;
}
.modal-mask.show{display:flex;}
.modal{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);width:100%;
  border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;animation:up .25s;
  box-shadow:0 -6px 24px rgba(140,120,100,.2);
}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.modal .close{
  float:right;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);
  background:linear-gradient(145deg,#ffffff,#f5efe6);width:32px;height:32px;border-radius:12px;
  box-shadow:var(--clay-soft);
}
.modal .close:active{transform:translateY(1px);box-shadow:var(--clay-press);}

/* ===== 首页大时间卡片 ===== */
.hero-card{
  background:linear-gradient(145deg,#f9f4ec,#e8d5c4);
  text-align:center;padding:22px 16px;
}
.hero-greet{
  font-size:18px;font-weight:800;color:#6b4f3a;margin-bottom:8px;
}
.hero-time{
  font-size:48px;font-weight:200;color:#5c4a3a;letter-spacing:2px;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.hero-date{
  font-size:13px;color:var(--text-soft);margin-top:10px;font-weight:500;
}

/* ===== 每日金句卡片 ===== */
.quote-card{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
}
.quote-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.quote-head span:first-child{
  font-size:15px;font-weight:700;color:#5c4a3a;
}
.quote-tag{
  font-size:11px;font-weight:600;color:#8b6f4e;
  background:linear-gradient(145deg,#f0e8dc,#e2d4c0);
  padding:4px 10px;border-radius:10px;box-shadow:var(--clay-soft);
}
.quote-zh{
  font-size:16px;font-weight:700;color:#5c4a3a;line-height:1.7;margin-bottom:8px;
}
.quote-en{
  font-size:13px;color:var(--text-soft);line-height:1.6;font-style:italic;
}

/* ===== 截图1风格：彩色大圆角卡片 ===== */
.card-pink{
  background:linear-gradient(145deg,#fff0f3,#ffe0e6) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-yellow{
  background:linear-gradient(145deg,#fff8e6,#ffeecc) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-blue{
  background:linear-gradient(145deg,#e8f4ff,#d0e8f7) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-green{
  background:linear-gradient(145deg,#e8f5e9,#d0ebd4) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-lav{
  background:linear-gradient(145deg,#f0e8ff,#e2d4f7) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}

/* 用户头像卡片 */
.user-card{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(145deg,#fff0f3,#ffe0e6);
  border-radius:28px;padding:16px 18px;
  box-shadow:var(--clay-card);margin-bottom:14px;
}
.user-avatar{
  width:54px;height:54px;border-radius:20px;
  background:linear-gradient(145deg,#fffdf8,#f2e6da);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:var(--clay-soft);flex-shrink:0;
}
.user-info{flex:1;}
.user-name{font-size:17px;font-weight:800;color:#5c4a3a;}
.user-meta{font-size:12px;color:var(--text-soft);margin-top:3px;}
.user-tag{
  font-size:10px;font-weight:700;color:#a08070;
  background:linear-gradient(145deg,#fff,#f5efe6);
  padding:4px 10px;border-radius:10px;box-shadow:var(--clay-soft);
}

/* 右上角标签 */
.card-tag{
  font-size:10px;font-weight:700;color:#8b6f4e;
  background:linear-gradient(145deg,#fff,#f5efe6);
  padding:4px 10px;border-radius:10px;box-shadow:var(--clay-soft);
  display:inline-block;
}

/* 打卡列表新样式 */
.mini-check-item{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:18px;padding:11px 14px;margin-bottom:10px;
  box-shadow:var(--clay-soft);position:relative;
}
.mini-check-item.done{background:linear-gradient(145deg,#f0e8dc,#e2d4c0);}
.mini-check-item .mc-ico{
  width:40px;height:40px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-soft);
}
.mini-check-item.done .mc-ico{background:linear-gradient(145deg,#e8d5c4,#c4a882);}
.mini-check-item .mc-name{flex:1;font-size:14px;font-weight:700;}
.mini-check-item .mc-time{font-size:10px;color:var(--text-soft);margin-top:2px;}
.mc-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;box-shadow:var(--clay-soft);
}
.mc-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.mc-done{flex-shrink:0;font-size:20px;}

/* ===== 读书页：书籍管理 ===== */
.add-book-btn{
  width:100%;border:none;border-radius:20px;padding:14px;
  font-size:15px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(145deg,#d4a5a5,#b88888);
  box-shadow:var(--clay);margin-bottom:14px;
}
.add-book-btn:active{transform:translateY(3px);box-shadow:var(--clay-press);}

.book-card{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:20px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--clay-card);position:relative;
}
.book-card .bc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.book-card .bc-cover{
  width:52px;height:70px;border-radius:10px;
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:var(--clay-soft);flex-shrink:0;
}
.book-card .bc-info{flex:1;}
.book-card .bc-title{font-size:15px;font-weight:800;color:#5c4a3a;margin-bottom:3px;}
.book-card .bc-author{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
.book-card .bc-meta{display:flex;gap:8px;flex-wrap:wrap;}
.book-card .bc-tag{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;
  background:linear-gradient(145deg,#f0e8dc,#e2d4c0);color:#6b4f3a;
  box-shadow:var(--clay-soft);
}
.book-card .bc-status{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;
  box-shadow:var(--clay-soft);
}
.book-card .bc-status.unread{background:linear-gradient(145deg,#f5efe6,#e2d8cb);color:#8b6f4e;}
.book-card .bc-status.reading{background:linear-gradient(145deg,#e8f5e9,#c8e6c9);color:#3a7d5f;}
.book-card .bc-status.finished{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;}
.book-card .bc-progress{
  margin-top:8px;height:8px;border-radius:8px;
  background:linear-gradient(145deg,#f5efe6,#e2d8cb);
  box-shadow:var(--clay-inset);overflow:hidden;
}
.book-card .bc-progress-bar{
  height:100%;border-radius:8px;
  background:linear-gradient(90deg,#c4a882,#a08060);
  transition:width .4s ease;
}
.book-card .bc-pages{font-size:11px;color:var(--text-soft);margin-top:4px;text-align:right;}
.book-card .bc-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;}
.book-card .bc-actions button{
  border:none;border-radius:10px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;
  background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);
}
.book-card .bc-actions button:active{transform:translateY(1px);box-shadow:var(--clay-press);}

/* 弹窗表单 */
.form-row{display:flex;gap:10px;margin-bottom:10px;}
.form-row > *{flex:1;}
.form-row .f-label{margin-top:0;}
select{
  width:100%;border:none;border-radius:14px;padding:11px 13px;
  font-size:14px;font-family:inherit;color:var(--text);
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-inset);outline:none;
  -webkit-appearance:none;appearance:none;
}
select:focus{box-shadow:var(--clay-inset),0 0 0 2px rgba(196,168,130,.45);}

/* 统计徽章 */
.stat-badges{display:flex;gap:8px;margin-bottom:14px;}
.stat-badge{
  flex:1;text-align:center;padding:10px 8px;border-radius:18px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  box-shadow:var(--clay-soft);
}
.stat-badge .num{font-size:18px;font-weight:800;color:#5c4a3a;}
.stat-badge .lab{font-size:10px;color:var(--text-soft);margin-top:2px;font-weight:600;}

/* 首页大时间 */
.hero-time-v2{
  font-size:clamp(34px,10vw,50px);font-weight:200;color:#5c4a3a;letter-spacing:1px;
  font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hero-greet-v2{
  font-size:20px;font-weight:800;color:#6b4f3a;
}
.hero-sub{
  font-size:13px;color:var(--text-soft);margin-top:6px;
}

/* ===== 通用 Tabs ===== */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{flex:1;min-width:70px;border:none;border-radius:14px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);font-family:inherit;transition:all .12s;}
.tab-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.tab-btn.on{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;box-shadow:var(--clay-press);}

/* ===== 记账 ===== */
.money-head{display:flex;align-items:center;justify-content:space-between;}
.money-head h3{margin:0;}
.m-lab{font-size:12px;color:var(--text-soft);font-weight:600;}
.m-big{font-size:26px;font-weight:800;color:#5c4a3a;margin-top:4px;}
.m-date-row{display:flex;gap:8px;margin-bottom:10px;}
.m-date-row select{flex:1;}
.m-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.m-cat{border:none;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);font-family:inherit;}
.m-cat:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.m-cat.on{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;box-shadow:var(--clay-press);}
.m-total{font-size:16px;font-weight:800;color:#c07f6b;}
.m-summary{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text-soft);font-weight:600;}
.m-summary b{color:#5c4a3a;font-size:13px;}
.m-inc-list{margin-top:10px;border-top:1px dashed rgba(120,100,80,.2);padding-top:8px;}
.m-inc-list .m-inc-title{font-size:12px;color:var(--text-soft);font-weight:700;margin-bottom:6px;}
.spend-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(140,120,100,.1);}
.spend-item:last-child{border-bottom:none;}
.spend-ico{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(145deg,#fff,#f5efe6);box-shadow:var(--clay-soft);flex-shrink:0;}
.spend-main{flex:1;}
.spend-item-name{font-size:14px;font-weight:700;}
.spend-item-meta{font-size:11px;color:var(--text-soft);margin-top:2px;}
.spend-amt{font-size:15px;font-weight:800;color:#c07f6b;}
.spend-amt.income-amt{color:#7a9a6a;}
.spend-del{border:none;background:none;font-size:16px;cursor:pointer;color:#c9b59a;padding:4px;}

/* ===== 穿搭 / 妆容 ===== */
.weather-card{background:linear-gradient(145deg,#fff,#e8f4ff);border-radius:24px;padding:18px;box-shadow:var(--clay-card);margin-bottom:14px;}
.w-row{display:flex;align-items:center;gap:12px;}
.w-ico{font-size:28px;}
.w-temp{font-size:30px;font-weight:800;}
.w-cond{font-size:14px;color:var(--text-soft);}
.w-city{margin-top:4px;font-size:12px;color:var(--text);border:none;background:rgba(255,255,255,.7);border-radius:10px;padding:5px 9px;box-shadow:var(--clay-inset);font-family:inherit;max-width:100%;}
.w-suggest{font-size:13px;color:var(--text-soft);margin-top:6px;line-height:1.5;}
.wardrobe-field{display:flex;gap:8px;margin-bottom:8px;}
.wardrobe-field input, .wardrobe-field select{flex:1;}
.cloth-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:linear-gradient(145deg,#fff,#f9f4ec);box-shadow:var(--clay-soft);margin-bottom:8px;}
.cloth-ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;background:linear-gradient(145deg,#f0e8dc,#e2d4c0);box-shadow:var(--clay-soft);}
.cloth-info{flex:1;}
.cloth-name{font-size:14px;font-weight:700;}
.cloth-meta{font-size:11px;color:var(--text-soft);margin-top:2px;}
.cloth-del{border:none;background:none;font-size:16px;cursor:pointer;color:#c9b59a;padding:4px;}
.mk-card{background:linear-gradient(145deg,#fff,#f9f4ec);border-radius:22px;padding:16px;box-shadow:var(--clay-card);margin-bottom:13px;position:relative;}
.mk-card .mk-tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:5px 13px;border-radius:11px;box-shadow:var(--clay-soft);}
.mk-card .mk-fav{position:absolute;top:14px;right:14px;border:none;background:linear-gradient(145deg,#fff,#f5efe6);color:#a68b76;width:34px;height:34px;border-radius:12px;font-size:16px;box-shadow:var(--clay-soft);cursor:pointer;}
.mk-card .mk-title{font-size:16px;font-weight:800;margin:10px 0;padding-right:40px;}
.mk-card .mk-img{width:100%;height:140px;border-radius:16px;background:linear-gradient(145deg,#f0e8ff,#e2d4f7);display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:var(--clay-inset);margin-bottom:10px;}
.mk-card .mk-play{border:none;border-radius:13px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);font-family:inherit;}

/* ===== 备忘 ===== */
.memo-top{display:flex;gap:8px;margin-bottom:8px;}
.memo-btn{border:none;border-radius:14px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--clay-soft);font-family:inherit;}
.memo-new{flex:1;background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;}
.memo-io{background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);flex:1;}
.memo-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.memo-filter{border:none;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);font-family:inherit;}
.memo-filter.on{background:linear-gradient(145deg,#d4e2ec,#a8c4d4);color:#fff;}
/* 备忘日程日历 */
.memo-cal-dot{width:5px;height:5px;border-radius:50%;background:#c4a882;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);}
.cal-cell .memo-cal-dot{position:absolute;}
.mm-events{margin-top:10px;border-top:1px dashed rgba(140,120,100,.25);padding-top:8px;}
.mm-day{font-size:13px;font-weight:800;color:#6b4f3a;margin-bottom:6px;}
.mev-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;background:linear-gradient(145deg,#f4f0e8,#ece4d6);box-shadow:var(--clay-inset);margin-bottom:7px;}
.mev-time{font-size:13px;font-weight:800;color:#8b6f4e;background:linear-gradient(145deg,#fff,#f2e6da);padding:4px 8px;border-radius:8px;box-shadow:var(--clay-soft);min-width:52px;text-align:center;}
.mev-main{flex:1;min-width:0;}
.mev-title{font-size:14px;font-weight:700;color:var(--text);}
.mev-note{font-size:11px;color:var(--text-soft);margin-top:2px;}
/* 首页日程提醒 */
.memo-remind{background:linear-gradient(145deg,#fff,#f3eafa);padding:12px 16px;}
.mr-head{font-size:14px;font-weight:800;color:#6b4f3a;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mr-count{font-size:11px;background:linear-gradient(145deg,#e0d0ef,#c4a882);color:#fff;padding:2px 8px;border-radius:9px;}
.mr-chips{display:flex;flex-wrap:wrap;gap:7px;}
.mr-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--text);background:#fff;border-radius:11px;padding:5px 10px;box-shadow:var(--clay-soft);}
.mr-time{font-size:12px;font-weight:800;color:#8b6f4e;background:linear-gradient(145deg,#f2e6da,#e2d4c0);padding:2px 6px;border-radius:7px;}
.mr-tip{font-size:11px;color:var(--text-soft);margin-top:8px;font-weight:600;}
.mr-empty{font-size:13px;color:var(--text-soft);font-weight:600;}
.memo-item{display:flex;gap:10px;padding:13px;border-radius:18px;background:linear-gradient(145deg,#fff,#f9f4ec);box-shadow:var(--clay-card);margin-bottom:10px;}
.memo-item .mi-main{flex:1;}
.memo-item .mi-title{font-size:15px;font-weight:800;}
.memo-item .mi-meta{font-size:11px;color:var(--text-soft);margin:4px 0;}
.memo-item .mi-text{font-size:13px;line-height:1.6;color:var(--text);}
.memo-item .mi-act{display:flex;gap:6px;flex-direction:column;justify-content:center;}
.mi-act button{border:none;border-radius:11px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);box-shadow:var(--clay-soft);font-family:inherit;}
.data-card .dc-use{font-size:13px;color:var(--text-soft);margin-bottom:10px;}
.data-card .dc-row{display:flex;gap:8px;margin-bottom:10px;}
.data-card .dc-row select{flex:1;}
.data-card .dc-row button{border:none;border-radius:13px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);box-shadow:var(--clay-soft);font-family:inherit;color:#a06060;}
.data-card .dc-warn{width:100%;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(145deg,#e8a08a,#d97a5f);box-shadow:var(--clay);cursor:pointer;font-family:inherit;}

/* ===== 运动 ===== */
.sport-counter{text-align:center;padding:14px;}
.sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sc-count{font-size:40px;font-weight:800;color:#c4a882;padding:22px;background:linear-gradient(145deg,#f9f4ec,#f0e8dc);border-radius:22px;box-shadow:var(--clay-inset);margin-bottom:6px;border:2px dashed #d4b896;}
.sc-plus{display:block;font-size:28px;font-weight:800;color:#c4a882;background:none;border:none;cursor:pointer;width:100%;padding:8px;}
.sc-reset{border:none;border-radius:14px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(145deg,#d4a5a5,#b88888);box-shadow:var(--clay);cursor:pointer;font-family:inherit;}
.sc-goal{margin-top:10px;}
.vid-card{background:linear-gradient(145deg,#fff,#f9f4ec);border-radius:20px;padding:12px;box-shadow:var(--clay-card);margin-bottom:12px;}
.vid-card .vc-title{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.vid-card .vc-title .vc-del{margin-left:auto;border:none;border-radius:10px;padding:5px 11px;font-size:11px;color:#c07f6b;background:linear-gradient(145deg,#fff,#f5efe6);box-shadow:var(--clay-soft);cursor:pointer;font-family:inherit;font-weight:700;}
.vid-card video{width:100%;border-radius:14px;background:#000;box-shadow:var(--clay-inset);max-height:260px;}
.vid-card .vc-ctrl{display:flex;gap:8px;align-items:center;margin-top:8px;}
.vid-card .vc-speed{display:flex;gap:6px;flex:1;}
.vs-btn{flex:1;border:none;border-radius:11px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;background:linear-gradient(145deg,#fff,#f5efe6);color:var(--text);box-shadow:var(--clay-soft);font-family:inherit;}
.vs-btn.on{background:linear-gradient(145deg,#d4e2ec,#a8c4d4);color:#fff;}
.vid-card .vc-del{border:none;border-radius:11px;padding:7px 12px;font-size:12px;color:#c07f6b;background:linear-gradient(145deg,#fff,#f5efe6);box-shadow:var(--clay-soft);cursor:pointer;font-family:inherit;font-weight:700;}

/* ===== 英语增强 ===== */
.eng-saved{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--clay-inset);}
.eng-saved .es-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(140,120,100,.08);}
.eng-saved .es-line:last-child{border-bottom:none;}
.es-text{flex:1;line-height:1.4;}

/* ============ 媒体存储（IndexedDB，支持大视频/图片） ============ */
/* localStorage 只有 ~5MB，存不下长视频；改用 IndexedDB 存 Blob，
   数据里只保存引用 'm:<id>'，渲染时用 mediaSrc() 取回对象 URL。          */
let _mediaDB;
const MEDIA_CACHE = {};   // id -> objectURL
const MEDIA_LOAD = {};    // id -> loading promise
function _mediaOpen(){
  if(_mediaDB) return _mediaDB;
  _mediaDB = new Promise((res,rej)=>{
    const rq = indexedDB.open('xiaoang_media', 1);
    rq.onupgradeneeded = ()=>{ const db=rq.result; if(!db.objectStoreNames.contains('media')) db.createObjectStore('media'); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  }).catch(()=>{ toast('无法使用本地存储，媒体可能无法保存'); return null; });
  return _mediaDB;
}
async function mediaPut(blob){
  const id = uid();
  try{
    const db = await _mediaOpen(); if(!db){ return ''; }
    await new Promise((res,rej)=>{ const tx=db.transaction('media','readwrite'); const o=tx.objectStore('media'); o.put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
    if(MEDIA_CACHE[id]) URL.revokeObjectURL(MEDIA_CACHE[id]);
    MEDIA_CACHE[id] = URL.createObjectURL(blob);
    return 'm:'+id;
  }catch(e){ console.error('mediaPut',e); toast('保存媒体失败'); return ''; }
}
async function mediaDelete(ref){
  if(!ref || !ref.startsWith('m:')) return;
  const id = ref.slice(2);
  try{
    const db = await _mediaOpen(); if(!db) return;
    await new Promise((res)=>{ const tx=db.transaction('media','readwrite'); tx.objectStore('media').delete(id); tx.oncomplete=res; tx.onerror=res; });
    if(MEDIA_CACHE[id]){ URL.revokeObjectURL(MEDIA_CACHE[id]); delete MEDIA_CACHE[id]; }
  }catch(e){}
}
function mediaSrc(ref){
  if(!ref) return '';
  if(ref.startsWith('data:')) return ref;              // 旧 base64 兼容
  if(ref.startsWith('m:')){
    const id=ref.slice(2);
    if(MEDIA_CACHE[id]) return MEDIA_CACHE[id];
    if(!MEDIA_LOAD[id]){
      MEDIA_LOAD[id]=(async()=>{ try{
        const db=await _mediaOpen(); if(!db) return;
        const blob=await new Promise((res,rej)=>{ const rq=db.transaction('media').objectStore('media').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
        if(blob){ const u=URL.createObjectURL(blob); MEDIA_CACHE[id]=u; }
      }catch(e){} })();
    }
    return MEDIA_CACHE[id] || '';
  }
  return ref; // 普通 URL
}
async function hydrateMedia(){
  const walk=(o)=>{ if(!o||typeof o!=='object')return; for(const k in o){ const v=o[k]; if(typeof v==='string'&&v.startsWith('m:')){ mediaSrc(v); } else walk(v); } };
  walk(DB); await Promise.all(Object.values(MEDIA_LOAD)); renderPage(currentPage);
}
/* 视频时长校验：返回 Promise<seconds>，用于 10 分钟限制 */
function videoDuration(file){
  return new Promise((res)=>{
    const url=URL.createObjectURL(file), v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ const d=v.duration; URL.revokeObjectURL(url); res(d); };
    v.onerror=()=>{ URL.revokeObjectURL(url); res(-1); };
    v.src=url;
  });
}
/* 保存视频到 IndexedDB，并校验时长（默认 ≤10 分钟） */
async function saveVideo(file, maxSec){
  const dur = await videoDuration(file);
  if(dur>0 && dur>(maxSec||600)){ toast(`视频超过 ${Math.round((maxSec||600)/60)} 分钟，请剪辑后上传`); return ''; }
  return await mediaPut(file);
}

function getDailyQuote(){
  const idx = new Date().getDate() % QUOTES.length;
  return QUOTES[idx];
}
function getLunarDate(d){
  // 简易农历：2026年近似映射（非精确，但够用）
  const lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
  const lunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  // 2026年农历正月初一 ≈ 公历 2026-02-17
  const base = new Date(2026,1,17);
  const diff = Math.floor((d - base) / (1000*60*60*24));
  if(diff < 0) return '';
  const lunarMonth = Math.floor(diff / 30) % 12;
  const lunarDay = diff % 30;
  return `农历 ${lunarMonths[lunarMonth]}${lunarDays[Math.min(lunarDay,29)]}`;
}

/* 首页：日程简要提醒（未来7天，小小一条，突出但不占大块） */
function embedMemoRemind(){
  const box=document.getElementById('memoRemind'); if(!box) return;
  const today=todayStr();
  // 未来7天日期集合（含今天）
  const daySet=[]; const dayLabels={};
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const ds=fmtDate(d);
    daySet.push(ds);
    dayLabels[ds] = i===0?'今天':(i===1?'明天':ds.slice(5).replace('-','月')+'日');
  }
  const evs=(DB.memoCalendar||[]).filter(e=>daySet.indexOf(e.date)>-1).sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date));
  if(!evs.length){
    box.innerHTML=`<div class="mr-empty">📌 近7天暂无日程安排，可在「备忘」里添加</div>`;
    return;
  }
  const chips=evs.map(e=>`<span class="mr-chip"><span class="mr-time">${dayLabels[e.date]||''} ${e.time||'--:--'}</span>${escapeHtml(e.title)}</span>`).join('');
  box.innerHTML=`<div class="mr-head">📌 近7天日程 <span class="mr-count">${evs.length}项</span></div>
    <div class="mr-chips">${chips}</div>
    <div class="mr-tip"></div>`;
  // 距最近一项（未来时间）倒计时
  const now=Date.now();
  let best=Infinity; let bestDate='';
  for(const e of evs){
    const tt=e.time&&e.time!=='--:--'?new Date(e.date+'T'+e.time).getTime():NaN;
    if(!isNaN(tt)&&tt>now){ if(tt<best){ best=tt; bestDate=e.date; } }
  }
  if(best<Infinity){
    const mins=Math.round((best-now)/60000);
    const txt = mins>=60? `约 ${Math.floor(mins/60)}小时${mins%60}分钟` : `约 ${mins} 分钟`;
    box.querySelector('.mr-tip').textContent='⏰ 距最近一项还有 '+txt;
  } else {
    box.querySelector('.mr-tip').textContent = evs.length? '✅ 近7天安排已全部完成' : '';
  }
}

let allCalView = {year:null, month:null, selected:null};

  const now = new Date();
  if(!allCalView.year){ allCalView.year=now.getFullYear(); allCalView.month=now.getMonth(); allCalView.selected=todayStr(); }
  applySelColor();
  const y=allCalView.year, m=allCalView.month, sel=allCalView.selected;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const isCur = y===now.getFullYear() && m===now.getMonth();
  const monLabel = `${y}年${m+1}月`;

  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    let cls='', tip = `本日 ${doneCount} 项已打卡`;

  }

  pagesEl.innerHTML = `
    <h1 class="page-title">${tIcon('allcal')}全部日历</h1>
    <div class="page-sub">点击日期查看该日所有类别的计划与实际完成情况</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="prevM2">‹ 上月</button>
        <div class="mon">${monLabel}</div>
        <button class="btn btn-ghost btn-sm" id="nextM2">› 下月</button>
      </div>
      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><span class="sw" style="background:${SOFT_MAP.blush}"></span>1-2 项</span>
        <span><span class="sw" style="background:${SOFT_MAP.mint}"></span>3-5 项</span>
        <span><span class="sw" style="background:linear-gradient(135deg,${SOFT_MAP.blush},${SOFT_MAP.sky})"></span>6+ 项（完成度高）</span>
        <span><span class="sw" style="background:var(--sel-bg)"></span>选中</span>
      </div>

  document.getElementById('nextM2').onclick=()=>{ allCalView.month++; if(allCalView.month>11){allCalView.month=0;allCalView.year++;} renderAllCal(); };

    c.onclick=()=>{ allCalView.selected=c.dataset.ds; renderAllCal(); };

}
function countDayDone(ds){
  const c = DB.checks[ds]||{};
  const z = DB.guzheng[ds]?.done;
  const s = DB.sport[ds]?.done;
  let n=0;
  CHECK_TASKS.forEach(t=>{ if(c[t.id]) n++; });
  if(z) n++;
  if(s) n++;
  return n;
}
function renderDaySummary(ds){
  // 周几
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(ds).getDay()];
  // 计划（按时间）
  const plans = CATS.filter(c=>c.id!=='daka' && DB.times[c.id])
    .map(c=>({...c, time:DB.times[c.id]}))
    .sort((a,b)=>a.time.split('-')[0].localeCompare(b.time.split('-')[0]));
  // 实际完成
  const checks = DB.checks[ds]||{};
  const z = DB.guzheng[ds]||{};
  const s = DB.sport[ds]||{};
  // 其他类别当日条目
  const dayEntries = (kind)=>Object.values(DB[kind]||{}).filter(e=>e.date===ds);

  // 左列：所有 8 个类别
  const left = CATS2.map(c=>{
    const time = DB.times[c.id] || '';
    let done=false, content='';
    if(c.id==='daka'){ /* 跳过——下方用其他表示 */ }
    if(c.id==='guzheng'){ done=!!z.done; if(z.note) content+=`<div class="summ-text">${escapeHtml(z.note)}</div>`; if((z.videos||[]).length) content+=`<div class="summ-media">${z.videos.map(v=>`<video src="${mediaSrc(v)}" controls></video>`).join('')}</div>`; }
    else if(c.id==='sport'){ done=!!s.done; if(s.note) content+=`<div class="summ-text">${escapeHtml(s.note)}</div>`; if((s.videos||[]).length) content+=`<div class="summ-media">${s.videos.map(v=>`<video src="${mediaSrc(v)}" controls></video>`).join('')}</div>`; }
    else {
      const entries = dayEntries(c.id);
      if(entries.length){
        done=true;
        content = entries.map(e=>{
          let media='';
          if((e.imgs||[]).length) media += `<div class="summ-media">${e.imgs.map(s=>`<img src="${s}">`).join('')}</div>`;
          if((e.videos||[]).length) media += `<div class="summ-media">${e.videos.map(s=>`<video src="${s}" controls></video>`).join('')}</div>`;
          return `<div class="summ-entry">${e.text?`<div class="summ-text">${escapeHtml(e.text)}</div>`:''}${media}</div>`;
        }).join('');
      }
    }
    return `<div class="summ-row" style="--cc:${COLOR_MAP[c.color]};--ss:${SOFT_MAP[c.color]}">
      <div class="summ-tag">
        <span class="summ-ico" style="background:${COLOR_MAP[c.color]}">${c.emoji}</span>
        <div>
          <div class="summ-name">${c.name}</div>
          ${time?`<div class="summ-time">🕐 ${time}</div>`:''}
        </div>
        <span class="summ-status ${done?'done':'none'}">${done?'✓ 完成':'— 未做'}</span>
      </div>
      ${content?`<div class="summ-content">${content}</div>`:''}
    </div>`;
  }).join('');

  // 顶部统计
  const doneN = countDayDone(ds);
  return `<div class="card">
    <div class="summ-head">
      <div>
        <div style="font-size:18px;font-weight:800">${ds} · ${wd}</div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:4px">完成 ${doneN}/${CHECK_TASKS.length+2} 项任务</div>
      </div>
      <div style="font-size:32px;font-weight:800;color:var(--mint)">${Math.round(doneN/(CHECK_TASKS.length+2)*100)}%</div>
    </div>
  </div>
  ${plans.length?`<div class="card">
    <h3>🕐 当日计划（按时间）</h3>
    ${plans.map(p=>`<div class="summ-plan"><span style="background:${COLOR_MAP[p.color]};color:#fff;padding:3px 9px;border-radius:8px;font-weight:700;font-size:12px">${p.time}</span><span style="margin-left:8px">${p.emoji} ${p.name}</span></div>`).join('')}
  </div>`:''}`;
}

    if(DB.guzheng[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].guzheng=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('togU').onclick=()=>{
    DB.sport[ds]=DB.sport[ds]||{done:false,note:'',videos:[]};
    DB.sport[ds].done=!DB.sport[ds].done;
    if(DB.sport[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].sport=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('saveDay').onclick=()=>{
    const rec = DB[kind][ds]||(DB[kind][ds]={done:false,note:'',videos:[]});
    rec.note = document.getElementById('dayNote').value;
    save(); toast('心得已保存'); showDayDetail(ds,kind);
  };
}

/* ================= 备忘 ================= */
const MEMO_CATS=['全部','日记','纪念日','穿搭记录','妆容记录','学习','其他'];
let memoFilter='全部';
/* ---- 备忘日程日历 ---- */
let memoCalView = {year:null, month:null, selected:null};
function memoEventsFor(ds){
  return (DB.memoCalendar||[]).filter(e=>e.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function memoCalHTML(){
  const now=new Date();
  if(!memoCalView.year){ memoCalView.year=now.getFullYear(); memoCalView.month=now.getMonth(); memoCalView.selected=todayStr(); }
  const y=memoCalView.year, m=memoCalView.month, sel=memoCalView.selected;
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cnt=memoEventsFor(ds).length; let cls='';
    if(sel===ds) cls=' today';
    cells+=`<div class="cal-cell ${cls}" data-mds="${ds}">${d}${cnt?`<div class="memo-cal-dot"></div>`:''}</div>`;
  }
  const evs=memoEventsFor(sel);
  return `
    <h3>📅 日程日历</h3>
    <div class="cal-head"><button class="btn btn-ghost btn-sm" id="mmPrev">‹ 上月</button><div class="mon">${y}年${m+1}月</div><button class="btn btn-ghost btn-sm" id="mmNext">› 下月</button></div>
    <div class="cal-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="mm-events">
      <div class="mm-day">${sel} · ${evs.length?evs.length+' 项安排':'无安排'}</div>
      ${evs.length? evs.map(ev=>memoEventItemHTML(ev)).join('') : '<div style="font-size:12px;color:var(--text-soft);padding:6px 2px;text-align:center">这一天还没安排，点下方「添加日程」记一笔</div>'}
    </div>
    <button class="btn btn-primary btn-block" id="addEvent">＋ 添加日程</button>`;
}
function memoEventItemHTML(ev){
  return `<div class="mev-item">
    <span class="mev-time">${ev.time||'--:--'}</span>
    <div class="mev-main"><div class="mev-title">${escapeHtml(ev.title)}</div>${ev.note?`<div class="mev-note">${escapeHtml(ev.note)}</div>`:''}</div>
    <button class="del-btn" data-evdel="${ev.id}">删除</button>
  </div>`;
}
function bindMemoCal(){
  document.getElementById('mmPrev').onclick=()=>{ memoCalView.month--; if(memoCalView.month<0){memoCalView.month=11;memoCalView.year--;} renderMemo(); };
  document.getElementById('mmNext').onclick=()=>{ memoCalView.month++; if(memoCalView.month>11){memoCalView.month=0;memoCalView.year++;} renderMemo(); };
  pagesEl.querySelectorAll('[data-mds]').forEach(c=>{ c.onclick=()=>{ memoCalView.selected=c.dataset.mds; renderMemo(); }; });
  document.getElementById('addEvent').onclick=()=>showEventModal(memoCalView.selected);
  pagesEl.querySelectorAll('[data-evdel]').forEach(b=>{ b.onclick=()=>{ DB.memoCalendar=(DB.memoCalendar||[]).filter(e=>e.id!==b.dataset.evdel); save(); renderMemo(); toast('已删除'); }; });
}
function showEventModal(date){
  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:17px;font-weight:800">添加日程</div><button class="close" id="eClose">&times;</button></div>
    <label class="f-label">日期</label><input type="date" id="eDate" value="${date||todayStr()}">
    <label class="f-label">时间</label><input type="time" id="eTime">

    <label class="f-label">备注（可选）</label><input type="text" id="eNote" placeholder="补充说明">
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" style="flex:1" id="eCancel">取消</button><button class="btn btn-primary" style="flex:1" id="eSave">保存</button></div>`;

function memoItemHTML(n){
  return `<div class="memo-item">

function renderMemo(){
  const notes=(DB.memo.notes||[]).slice().sort((a,b)=>b.ts-a.ts);
  const filtered=memoFilter==='全部'?notes:notes.filter(n=>n.cat===memoFilter);
  const kb=(JSON.stringify(DB).length/1024).toFixed(1);
  pagesEl.innerHTML=`
    <h1 class="page-title">${tIcon('memo')}备忘</h1>
    <div class="page-sub">记录生活的小确幸</div>
    <div class="card"><div class="memo-top">

      <button class="memo-btn memo-io" id="memoExport">导出</button>
      <button class="memo-btn memo-io" id="memoImport">导入</button>
    </div></div>
    <div class="card">${memoCalHTML()}</div>
    <div class="card">
      <div class="memo-filters">${MEMO_CATS.map(c=>`<button class="memo-filter ${c===memoFilter?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
      ${filtered.length? filtered.map(n=>memoItemHTML(n)).join('') : '<div style="text-align:center;color:var(--text-soft);padding:20px">还没有笔记，点「+ 新建笔记」记录第一条吧</div>'}
    </div>
    <div class="card data-card">
      <h3>🗄️ 数据管理</h3>
      <div class="dc-use">localStorage 空间：${kb} KB</div>
      <div class="dc-row"><select id="dcCat">${MEMO_CATS.filter(c=>c!=='全部').map(c=>`<option value="${c}">${c}</option>`).join('')}</select><button id="dcClearCat">清除该类</button></div>
      <button class="dc-warn" id="dcWarn">⚠️ 清除全部数据</button>
    </div>`;
  pagesEl.querySelectorAll('.memo-filter').forEach(b=>{ b.onclick=()=>{ memoFilter=b.dataset.cat; renderMemo(); }; });
  bindMemoCal();
  document.getElementById('memoNew').onclick=()=>showMemoModal();
  document.getElementById('memoExport').onclick=()=>{ downloadFile('晓昂备忘.json', JSON.stringify(DB.memo,null,2)); };
  document.getElementById('memoImport').onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return; try{ const j=JSON.parse(await readFileAsText(f)); if(j&&j.notes){ DB.memo.notes=j.notes; save(); toast('已导入'); renderMemo(); } else toast('文件格式不正确'); }catch(e){ toast('导入失败'); } };
    inp.click();
  };
  document.getElementById('dcClearCat').onclick=()=>{ const c=document.getElementById('dcCat').value; if(confirm('确定清除「'+c+'」分类的所有笔记吗？')){ DB.memo.notes=DB.memo.notes.filter(n=>n.cat!==c); save(); renderMemo(); toast('已清除'); } };
  document.getElementById('dcWarn').onclick=()=>{ if(confirm('⚠️ 将清空全部数据（包括打卡、记录、图片等），此操作不可恢复！确定继续吗？')){ DB=JSON.parse(JSON.stringify(DEFAULT_DATA)); save(); switchPage('daka'); toast('已清空'); } };
  pagesEl.querySelectorAll('[data-medit]').forEach(b=>{ b.onclick=()=>showMemoModal(b.dataset.medit); });
  pagesEl.querySelectorAll('[data-mdel]').forEach(b=>{ b.onclick=()=>{ DB.memo.notes=DB.memo.notes.filter(n=>n.id!==b.dataset.mdel); save(); renderMemo(); }; });

let sportTab='dance';
const SPORT_RATES=[0.5,0.75,1];
function renderSport(){
  pagesEl.innerHTML=`
    <h1 class="page-title">${tIcon('sport')}运动</h1>
    <div class="page-sub">跟着视频动起来</div>
    <div class="tabs">
      <button class="tab-btn ${sportTab==='dance'?'on':''}" data-tab="dance">💃 舞蹈</button>
      <button class="tab-btn ${sportTab==='other'?'on':''}" data-tab="other">🏋️ 其他</button>
    </div>
    ${sportCounterHTML()}
    ${sportVideoHTML(sportTab)}`;
  pagesEl.querySelectorAll('.tab-btn').forEach(b=>{ b.onclick=()=>{ sportTab=b.dataset.tab; renderSport(); }; });
  bindSport();
}
function sportCounterHTML(){
  const cnt=DB.sportVideos.counter[sportTab]||0, goal=DB.sportVideos.goal[sportTab]||300;
  return `<div class="card sport-counter">
    <div class="sc-top"><span style="font-size:13px;font-weight:700">✊ 打卡计数（${sportTab==='dance'?'舞蹈':'其他'}）</span><span style="font-size:12px;color:var(--text-soft)">${cnt} / ${goal}</span></div>
    <div class="sc-count">${cnt}</div>
    <button class="sc-plus" id="scPlus">+1</button>
    <button class="sc-reset" id="scReset">重置</button>
    <div class="sc-goal"><label class="f-label">目标次数</label><input type="number" id="scGoal" value="${goal}" min="1"><button class="btn btn-ghost btn-sm btn-block" id="scSetGoal" style="margin-top:8px">设置目标</button></div>
  </div>`;
}
function sportVideoHTML(tab){
  const vids=DB.sportVideos[tab]||[];
  return `<div class="card">
    <h3>🎬 运动视频（${tab==='dance'?'舞蹈':'其他'}）</h3>
    <button class="btn btn-primary btn-block" id="addVidBtn" style="margin-bottom:12px">＋ 导入视频</button>
    ${vids.length? vids.map(v=>vidCardHTML(v)).join('') : '<div style="text-align:center;color:var(--text-soft);padding:16px">还没有视频，导入一个开始跟练吧</div>'}
    <input type="file" id="vidInput" accept="video/*" style="display:none">
  </div>`;
}
function vidCardHTML(v){
  return `<div class="vid-card">
    <div class="vc-title"><span>▶️ ${escapeHtml(v.name||'运动视频')}</span><button class="vc-del" data-vdel="${v.id}">删除</button></div>
    <video src="${mediaSrc(v.src)}" controls playsinline preload="metadata"></video>
    <div class="vc-ctrl"><div class="vc-speed">${SPORT_RATES.map(r=>`<button class="vs-btn" data-vid="${v.id}" data-rate="${r}">${r}×</button>`).join('')}</div></div>
  </div>`;
}
function bindSport(){
  document.getElementById('scPlus').onclick=()=>{ DB.sportVideos.counter[sportTab]=(DB.sportVideos.counter[sportTab]||0)+1; save(); renderSport(); };
  document.getElementById('scReset').onclick=()=>{ DB.sportVideos.counter[sportTab]=0; save(); renderSport(); };
  document.getElementById('scSetGoal').onclick=()=>{ const g=+document.getElementById('scGoal').value||300; DB.sportVideos.goal[sportTab]=g; save(); toast('目标已设'); renderSport(); };
  document.getElementById('addVidBtn').onclick=()=>document.getElementById('vidInput').click();
  document.getElementById('vidInput').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const src=await saveVideo(f, 600); if(!src) return;
    DB.sportVideos[sportTab].push({id:uid(),name:f.name.replace(/\.[^.]+$/,''),src}); save(); renderSport(); toast('视频已保存');
  };
  pagesEl.querySelectorAll('.vs-btn').forEach(b=>{ b.onclick=()=>{
    const vid=b.closest('.vid-card').querySelector('video'); if(!vid)return;
    vid.playbackRate=parseFloat(b.dataset.rate);
    b.closest('.vc-speed').querySelectorAll('.vs-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }; });
  pagesEl.querySelectorAll('[data-vdel]').forEach(b=>{ b.onclick=()=>{ DB.sportVideos[sportTab]=DB.sportVideos[sportTab].filter(v=>v.id!==b.dataset.vdel); save(); renderSport(); }; });
}

/* ---------- 通用日记/上传页（灵感/读书/手工/穿搭） ---------- */
function renderDiary(kind){
  const cfg = {
    inspire:{emoji:'💡',name:'选题灵感',color:'lemon',allowImg:true,allowVideo:false,allowBook:false},
    read:{emoji:'📖',name:'读书',color:'mint',allowImg:true,allowVideo:false,allowBook:true},
    craft:{emoji:'🧶',name:'手工',color:'peach',allowImg:true,allowVideo:true,allowBook:false},
    outfit:{emoji:'👗',name:'穿搭',color:'pink',allowImg:true,allowVideo:false,allowBook:false},
  }[kind];
  const entries = Object.values(DB[kind]||{}).sort((a,b)=>(b.date||0)-(a.date||0));
  pagesEl.innerHTML = `
    <h1 class="page-title">${tIcon(kind)}${cfg.name}</h1>
    <div class="page-sub">记录图片、视频与心得</div>
    <div class="card">
      <h3>✍️ 写心得</h3>
      <textarea id="newNote" placeholder="写点今天的心得…"></textarea>
      ${cfg.allowBook?`
        <label class="f-label">📚 预留书名</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="newBook" placeholder="输入书名并添加到书单">
          <button class="btn btn-ghost btn-sm" id="addBook">添加</button>
        </div>
        <div class="book-list" id="bookList"></div>`:''}
      ${cfg.allowImg?`<label class="f-label">🖼️ 上传图片</label><input type="file" id="newImgs" accept="image/*" multiple>`:''}
      ${cfg.allowVideo?`<label class="f-label">🎬 上传视频</label><input type="file" id="newVideos" accept="video/*" multiple>`:''}
      <button class="btn btn-primary btn-block" style="margin-top:14px" id="saveEntry">发布</button>
    </div>
    <div id="entries">${entries.map(en=>entryHTML(en,cfg)).join('')||'<div style="text-align:center;color:var(--text-soft);padding:20px">还没有记录哦～</div>'}</div>`;

  // 书名
  if(cfg.allowBook){
    const bl = document.getElementById('bookList');
    const renderBooks=()=>{ bl.innerHTML = DB.books.map(b=>`<div class="book-item"><span>📕</span><span style="flex:1">${escapeHtml(b.name)}</span><button class="del-btn" data-bid="${b.id}">删除</button></div>`).join(''); };
    renderBooks();
    document.getElementById('addBook').onclick=()=>{
      const v=document.getElementById('newBook').value.trim(); if(!v) return toast('请输入书名');
      DB.books.push({id:uid(),name:v}); save(); document.getElementById('newBook').value=''; renderBooks(); toast('已加入书单');
    };
    bl.addEventListener('click',e=>{
      const d=e.target.closest('[data-bid]'); if(!d) return;
      DB.books=DB.books.filter(b=>b.id!==d.dataset.bid); save(); renderBooks();
    });
  }

  // 发布新记录
  document.getElementById('saveEntry').onclick=async()=>{
    const text = document.getElementById('newNote').value.trim();
    const imgs=[], videos=[];
    if(document.getElementById('newImgs')){ for(const f of document.getElementById('newImgs').files){ imgs.push(await saveImage(f)); } }
    if(document.getElementById('newVideos')){ for(const f of document.getElementById('newVideos').files){ const s=await saveVideo(f,600); if(s) videos.push(s); } }
    if(!text && !imgs.length && !videos.length) return toast('请先填写心得或上传文件');
    DB[kind]=DB[kind]||{};
    const id=uid();
    DB[kind][id]={id,date:todayStr(),ts:Date.now(),text,imgs,videos};
    save(); renderDiary(kind); toast('已发布');
  };
  // 删除
  pagesEl.querySelector('#entries').addEventListener('click',e=>{
    const d=e.target.closest('[data-del]'); if(!d) return;
    delete DB[kind][d.dataset.del]; save(); renderDiary(kind);
  });
}

function entryHTML(en,cfg){
  const media='';
  const imgs = (en.imgs||[]).map(s=>`<img src="${mediaSrc(s)}">`).join('');
  const vids = (en.videos||[]).map(s=>`<video src="${mediaSrc(s)}" controls></video>`).join('');
  return `<div class="note-item">
    <div class="n-head"><span class="n-date">${en.date}</span><button class="del-btn" data-del="${en.id}">删除</button></div>
    ${en.text?`<div class="n-text">${escapeHtml(en.text)}</div>`:''}
    ${(imgs||vids)?`<div class="media-grid">${imgs}${vids}</div>`:''}
  </div>`;
}

/* ---------- 读书：书籍管理（截图2风格） ---------- */
const BOOK_CATS = ['文学','英语','小说','励志','经济'];
const BOOK_STATUS = ['未读','在读','已读'];

function renderReadBooks(){
  const books = DB.readBooks || [];
  const unread = books.filter(b=>b.status==='未读');
  const reading = books.filter(b=>b.status==='在读');
  const finished = books.filter(b=>b.status==='已读');

  pagesEl.innerHTML = `
    <h1 class="page-title">${tIcon('read')}读书</h1>
    <div class="page-sub">管理你的阅读进度</div>

    <button class="add-book-btn" id="openAddBook">+ 添加书籍</button>

    <!-- 统计 -->
    <div class="stat-badges">
      <div class="stat-badge"><div class="num">${unread.length}</div><div class="lab">未读</div></div>
      <div class="stat-badge"><div class="num">${reading.length}</div><div class="lab">在读</div></div>
      <div class="stat-badge"><div class="num">${finished.length}</div><div class="lab">已读</div></div>
    </div>

    <!-- 在读 -->
    ${reading.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📚 在读 (${reading.length}本)</div>
      ${reading.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 未读 -->
    ${unread.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📖 未读 (${unread.length}本)</div>
      ${unread.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 已读 -->
    ${finished.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">✅ 已读 (${finished.length}本)</div>
      ${finished.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    ${!books.length?'<div style="text-align:center;color:var(--text-soft);padding:30px">还没有书籍，点击上方「+ 添加书籍」开始记录吧～</div>':''}

    <!-- 旧版日记兼容 -->
    <div style="margin-top:20px">
      <button class="btn btn-ghost btn-block" onclick="switchPage('inspire')" style="font-size:12px">📔 查看旧版读书笔记</button>
    </div>`;

  document.getElementById('openAddBook').onclick = ()=> showBookModal();

  // 编辑/删除
  pagesEl.querySelectorAll('.bc-actions').forEach(row=>{
    row.addEventListener('click', e=>{
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-del]');
      if(editBtn) showBookModal(editBtn.dataset.edit);
      if(delBtn){
        if(confirm('确定删除这本书吗？')){
          DB.readBooks = DB.readBooks.filter(b=>b.id!==delBtn.dataset.del);
          save(); renderReadBooks(); toast('已删除');
        }
      }
    });
  });
}

function bookCardHTML(b){
  const pct = b.totalPages>0 ? Math.round((b.currentPage||0)/b.totalPages*100) : 0;
  const statusClass = b.status==='未读'?'unread':b.status==='在读'?'reading':'finished';
  return `<div class="book-card">
    <div class="bc-head">
      <div class="bc-cover">📕</div>
      <div class="bc-info">
        <div class="bc-title">${escapeHtml(b.title||'未命名')}</div>
        <div class="bc-author">${escapeHtml(b.author||'未知作者')}</div>
        <div class="bc-meta">
          <span class="bc-tag">${b.category||'未分类'}</span>
          <span class="bc-status ${statusClass}">${b.status}</span>
        </div>
      </div>
    </div>
    <div class="bc-progress"><div class="bc-progress-bar" style="width:${pct}%"></div></div>
    <div class="bc-pages">${b.currentPage||0} / ${b.totalPages||0} 页 · ${pct}%</div>
    <div class="bc-actions">
      <button data-edit="${b.id}">编辑</button>
      <button data-del="${b.id}">删除</button>
    </div>
  </div>`;
}

function showBookModal(bookId){
  const isEdit = !!bookId;
  const book = isEdit ? DB.readBooks.find(b=>b.id===bookId) : null;
  const title = book?.title||'';
  const author = book?.author||'';
  const totalPages = book?.totalPages||'';
  const category = book?.category||'文学';
  const status = book?.status||'未读';
  const currentPage = book?.currentPage||'';

  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:17px;font-weight:800">${isEdit?'编辑书籍':'添加书籍'}</div>
      <button class="close" id="closeModal">&times;</button>
    </div>
    <label class="f-label">书名</label>
    <input type="text" id="bTitle" placeholder="书名" value="${escapeHtml(title)}">
    <div class="form-row">
      <div>
        <label class="f-label">作者</label>
        <input type="text" id="bAuthor" placeholder="作者" value="${escapeHtml(author)}">
      </div>
      <div>
        <label class="f-label">总页数</label>
        <input type="number" id="bTotal" placeholder="300" value="${totalPages}">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label class="f-label">分类</label>
        <select id="bCat">
          ${BOOK_CATS.map(c=>`<option value="${c}" ${c===category?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="f-label">状态</label>
        <select id="bStatus">
          ${BOOK_STATUS.map(s=>`<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <label class="f-label">当前页数</label>
    <input type="number" id="bCurrent" placeholder="0" value="${currentPage}">
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-ghost" style="flex:1" id="cancelBook">取消</button>
      <button class="btn btn-primary" style="flex:1" id="saveBook">保存</button>
    </div>`;

  document.getElementById('modalMask').classList.add('show');

  document.getElementById('closeModal').onclick = ()=> document.getElementById('modalMask').classList.remove('show');
  document.getElementById('cancelBook').onclick = ()=> document.getElementById('modalMask').classList.remove('show');
  document.getElementById('saveBook').onclick = ()=>{
    const t = document.getElementById('bTitle').value.trim();
    if(!t){ toast('请输入书名'); return; }
    const data = {
      id: isEdit ? bookId : uid(),
      title: t,
      author: document.getElementById('bAuthor').value.trim(),
      totalPages: parseInt(document.getElementById('bTotal').value)||0,
      category: document.getElementById('bCat').value,
      status: document.getElementById('bStatus').value,
      currentPage: parseInt(document.getElementById('bCurrent').value)||0,
      addedDate: isEdit ? (book?.addedDate||todayStr()) : todayStr()
    };
    if(isEdit){
      const idx = DB.readBooks.findIndex(b=>b.id===bookId);
      if(idx>=0) DB.readBooks[idx]=data;
    } else {
      DB.readBooks.push(data);
    }
    save();
    document.getElementById('modalMask').classList.remove('show');
    renderReadBooks();
    toast(isEdit?'已保存':'已添加');
  };
}

      <h3>💬 你说了什么 → 标准英文表达</h3>

      <label class="f-label">中英混杂自动转准确英文</label>
      <div class="eng-phrase" id="engCorrect" style="font-size:15px;color:#7a9a6a">—</div>
      <label class="f-label">也可以手动输入</label>
      <textarea id="engInput" placeholder="输入英文或中英混杂…"></textarea>
      <button class="btn btn-primary btn-block" id="correctBtn" style="margin-top:8px">✨ 转为标准英文</button>
    </div>

    <div class="card">
      <h3>🔊 美式配音 · 变速跟读</h3>
      <div class="speed-row">${[0.5,0.75,1,1.5].map(r=>`<button class="speed-btn ${r===engRate?'on':''}" data-rate="${r}">${r}×</button>`).join('')}</div>
      <label class="f-label" style="display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" id="engLoop" style="width:auto" ${engLoop?'checked':''}> 单曲循环</label>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-primary" style="flex:1" id="speakBtn">▶️ 播放</button>
        <button class="btn btn-ghost" style="flex:1" id="saveBtn">💾 保存</button>
      </div>
    </div>

    <div class="card">
      <h3>📚 保存的听力文本</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn btn-ghost btn-sm" style="flex:1" id="importBtn">📥 导入文本</button>
        <button class="btn btn-ghost btn-sm" style="flex:1" id="exportBtn">📤 导出</button>
      </div>
      <div id="savedBox">${saved.length? engSavedHTML(saved) : '<div style="text-align:center;color:var(--text-soft);padding:14px">还没有保存的听力文本</div>'}</div>
    </div>

    <div class="card">
      <h3>🎯 每日必打卡 · 薄弱点</h3>
      <div class="page-sub" style="margin-bottom:8px">从对话中提取的难点词，点击即可跟读</div>
      <div id="weakBox">${weakArr.length? `<div>${weakArr.slice(0,20).map(w=>`<span class="weak-chip" data-word="${w}">${w}<span class="w-count">×${weak[w]}</span></span>`).join('')}</div>` : '<div style="text-align:center;color:var(--text-soft);padding:14px">对话后自动积累，先录一段吧</div>'}</div>
    </div>`;

  bindRec(t=>onSentence(t));
  pagesEl.querySelectorAll('.speed-btn').forEach(b=>{ b.onclick=()=>{ engRate=parseFloat(b.dataset.rate); pagesEl.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; });
  document.getElementById('engLoop').onchange=e=>{ engLoop=e.target.checked; };
  document.getElementById('speakBtn').onclick=()=>{ const t=document.getElementById('engInput').value.trim()||document.getElementById('engPhrase').textContent; if(!t||t==='（尚未识别）') return toast('请先输入或识别语句'); speak(t, engRate, engLoop); };
  document.getElementById('saveBtn').onclick=()=>{ const t=document.getElementById('engInput').value.trim()||document.getElementById('engPhrase').textContent; if(!t||t==='（尚未识别）') return toast('没有可保存的句子'); DB.englishListen.saved.push(t); save(); renderSaved(); toast('已保存'); };
  document.getElementById('correctBtn').onclick=()=>{ const v=document.getElementById('engInput').value.trim(); if(v) onSentence(v); };
  document.getElementById('importBtn').onclick=()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.txt,text/plain'; inp.onchange=async()=>{ const f=inp.files[0]; if(!f)return; const txt=await readFileAsText(f); (txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)).forEach(l=>DB.englishListen.saved.push(l)); save(); renderSaved(); toast('已导入'); }; inp.click(); };
  document.getElementById('exportBtn').onclick=()=>{ downloadFile('晓昂听力.txt', saved.join('\n')); };
}
function engSavedHTML(saved){
  return `<div class="eng-saved">${saved.map((s,i)=>`
    <div class="es-line">
      <button class="es-loop" data-lp="${i}">🔂</button>
      <span class="es-text">${escapeHtml(s)}</span>
      <button class="es-loop" data-dels="${i}">✕</button>
    </div>`).join('')}</div>`;
}
function renderSaved(){
  const box=document.getElementById('savedBox'); const saved=DB.englishListen.saved||[]; if(!box)return;
  box.innerHTML=saved.length? engSavedHTML(saved) : '<div style="text-align:center;color:var(--text-soft);padding:14px">还没有保存的听力文本</div>';
  document.querySelectorAll('#savedBox [data-lp]').forEach(b=>{ b.onclick=()=>{ const s=DB.englishListen.saved[+b.dataset.lp]; if(s) speak(s, engRate, true); }; });
  document.querySelectorAll('#savedBox [data-dels]').forEach(b=>{ b.onclick=()=>{ DB.englishListen.saved.splice(+b.dataset.dels,1); save(); renderSaved(); }; });
}
let listening=false, engLoop=false;
function bindRec(onText){
  document.getElementById('recBtn').onclick=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ toast('当前浏览器不支持语音识别'); return; }
    if(listening){ if(recognition) recognition.stop(); return; }
    recognition=new SR(); recognition.lang='en-US'; recognition.interimResults=false; recognition.continuous=false;
    listening=true; document.getElementById('recBtn').textContent='⏹️ 停止'; document.getElementById('recStatus').textContent='录音中…请说英文';
    recognition.onresult=e=>{ const t=e.results[0][0].transcript; document.getElementById('recBtn').textContent='🎙️ 开始录音'; listening=false; document.getElementById('recStatus').textContent='识别完成 ✓'; onText(t); };
    recognition.onerror=()=>{ document.getElementById('recBtn').textContent='🎙️ 开始录音'; listening=false; document.getElementById('recStatus').textContent='识别失败，请重试'; };
    recognition.onend=()=>{ if(listening){ listening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; document.getElementById('recStatus').textContent='识别结束'; } };
    recognition.start();
  };
}
function renderWeakChips(){
  const box=document.getElementById('weakBox'); const weak=DB.englishListen.weak||{}; if(!box)return;
  const wa=Object.keys(weak).sort((a,b)=>weak[b]-weak[a]);
  box.innerHTML=wa.length? `<div>${wa.slice(0,20).map(w=>`<span class="weak-chip" data-word="${w}">${w}<span class="w-count">×${weak[w]}</span></span>`).join('')}</div>` : '<div style="text-align:center;color:var(--text-soft);padding:14px">对话后自动积累，先录一段吧</div>';
  document.querySelectorAll('#weakBox [data-word]').forEach(b=>{ b.onclick=()=>speak(b.dataset.word,0.9); });
}
async function engTranslate(text){
  const hasCJK=/[\u4e00-\u9fa5]/.test(text); if(!hasCJK) return {ok:false,result:text};
  try{ const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN|en'); const j=await r.json(); const t=(j.responseData&&j.responseData.translatedText)||''; if(t) return {ok:true,result:t.trim()}; }catch(e){}
  return {ok:false,result:text};
}
function extractWeak(text){
  const stop=new Set(['the','a','an','is','are','was','were','i','you','he','she','it','we','they','to','of','in','on','at','and','or','for','that','this','with','my','your','his','her','our','their','not','do','does','did','have','has','had','there','be','been','can','could','will','would','should','just','really','so','very','what','when','where','who','how','why','about','because','but','if','then','than','too','also','me','him','them','us','from','as','into','no','yes']);
  return (text.match(/[a-zA-Z']+/g)||[]).map(w=>w.toLowerCase()).filter(w=>w.length>3&&!stop.has(w));
}
async function onSentence(text){
  const ph=document.getElementById('engPhrase'), cor=document.getElementById('engCorrect'), inp=document.getElementById('engInput');
  if(ph) ph.textContent=text; if(inp) inp.value=text;
  const ws=extractWeak(text);
  DB.englishListen.weak=DB.englishListen.weak||{};
  ws.forEach(w=>{ DB.englishListen.weak[w]=(DB.englishListen.weak[w]||0)+1; });
  save();
  const trans=await engTranslate(text);
  if(cor) cor.textContent = trans.ok? ('✔ '+trans.result) : (/[\u4e00-\u9fa5]/.test(text)? '（含中文，联网后可自动翻译）': text);
  DB.englishListen.dialogue.push({role:'you',text,trans:trans.ok?trans.result:''}); save();
  renderWeakChips();
}

/* ---------- 时间标注 & 计划表 ---------- */

  // 嵌入到每个页面底部：时间设置 + 计划表入口。这里单独页面
  return `<div class="card">
    <h3>🕐 为每个类别设置时间段</h3>

      <div class="time-set">
        <span style="width:70px;font-size:13px">${c.emoji} ${c.name}</span>
        <input type="time" value="${(DB.times[c.id]||'').split('-')[0]||''}" data-id="${c.id}" data-part="start">
        <span>—</span>
        <input type="time" value="${(DB.times[c.id]||'').split('-')[1]||''}" data-id="${c.id}" data-part="end">

function renderPlan(){
  const items = CATS.filter(c=>c.id!=='daka').map(c=>({
    ...c, time: DB.times[c.id] || '', start: (DB.times[c.id]||'').split('-')[0]||''
  })).filter(x=>x.time).sort((a,b)=>a.start.localeCompare(b.start));

        <span class="plan-ico">${it.emoji}</span>
        <div class="plan-name">${it.name}</div>
        ${done?'<span style="font-size:16px">✅</span>':'<span class="plan-tag">待完成</span>'}

    }).join('') : '<div style="text-align:center;color:var(--text-soft);padding:30px">还没有设置时间，请先在「设置时间」里标注时间段</div>'}
    <div style="margin-top:16px">
      <button class="btn btn-ghost btn-block" onclick="switchPage('time')">🕐 设置时间段</button>
    </div>`;
}

function renderTimePage(){
  pagesEl.innerHTML = `<h1 class="page-title">${tIcon('timeset')}设置时间段</h1>
    <div class="page-sub">为每个类别标注时间，自动生成计划表</div>`+renderTimes();
  document.getElementById('saveTimes').onclick=()=>{
    pagesEl.querySelectorAll('.time-set').forEach(ts=>{
      const s=ts.querySelector('[data-part=start]').value, e=ts.querySelector('[data-part=end]').value;
      const id=ts.querySelector('[data-part=start]').dataset.id;
      if(s&&e) DB.times[id]=`${s}-${e}`;
      else if(!s&&!e) delete DB.times[id];
    });
    save(); toast('时间已保存'); switchPage('daka');
  };
}

/* ================= 工具函数 ================= */
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 实时语音识别用全局 recognition 变量 */

/* TTS 美式发音 + 变速 + 单曲循环 */
let recognition;
function speak(text, rate, loop){
  if(!('speechSynthesis' in window)) return toast('浏览器不支持语音合成');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate = rate||1;
  // 选美式声音
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang==='en-US' && /Samantha|Google US English|Alex/i.test(v.name)) || voices.find(v=>v.lang==='en-US');
  if(enVoice) u.voice=enVoice;
  if(loop){ u.onend=()=>speechSynthesis.speak(u); }
  speechSynthesis.speak(u);
}
/* 文件下载 */
function downloadFile(name, text){
  const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
}
/* 读取文件为文本 */
function readFileAsText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }

/* ================= 初始化 ================= */
// 预加载声音
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
switchPage('daka');
applySelColor();

const _pageParam=new URLSearchParams(location.search).get('page');
if(_pageParam) switchPage(_pageParam);
// 迁移并加载媒体库里的图片/视频
if('indexedDB' in window) hydrateMedia();
