<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晓昂工作台">
<meta name="theme-color" content="#f7fbf9">
<title>晓昂工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<style>
:root{
  --bg:#f5efe6;
  /* 奶咖/浅棕系色板 */
  --cream:#f9f4ec;     --cream-soft:#fffbf5;
  --latte:#e8d5c4;     --latte-soft:#f2e6da;
  --cocoa:#c4a882;     --cocoa-soft:#e2d4c0;
  --mocha:#8b6f4e;     --mocha-soft:#c9b59a;
  --walnut:#6b4f3a;    --walnut-soft:#a68b76;
  --honey:#e6c88a;     --honey-soft:#f2e0b8;
  --sage:#a8b89a;      --sage-soft:#d4dcc8;
  --rose:#d4a5a5;      --rose-soft:#eed4d4;
  --sky:#a8c4d4;       --sky-soft:#d4e2ec;
  --text:#5c4a3a;      --text-soft:#9a8a7a;
  --card:#fffbf7;
  --radius:22px;
  /* 轻黏土质感：凸起 = 顶部白高光 + 底部半透明厚度 + 柔投影 */
  --clay:       inset 0 2px 3px rgba(255,255,255,.85), inset 0 -3px 5px rgba(0,0,0,.06), 0 5px 0 rgba(0,0,0,.07), 0 9px 18px rgba(140,120,100,.18);
  --clay-soft:  inset 0 2px 3px rgba(255,255,255,.9),  inset 0 -2px 4px rgba(0,0,0,.05), 0 3px 0 rgba(0,0,0,.05), 0 6px 12px rgba(140,120,100,.14);
  --clay-card:  inset 0 2px 3px rgba(255,255,255,.9),  0 5px 16px rgba(140,120,100,.14);
  --clay-press: inset 0 3px 6px rgba(0,0,0,.12), inset 0 1px 2px rgba(0,0,0,.06), 0 1px 0 rgba(0,0,0,.06);
  --clay-inset: inset 0 2px 5px rgba(0,0,0,.07), inset 0 1px 2px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-user-select:none;user-select:none;
}

/* ===== 主布局 ===== */
#app{display:flex;height:100%;height:100dvh;}
#sidebar{
  width:92px;min-width:92px;height:100%;
  background:linear-gradient(180deg,#ede5da,#e2d8cb);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:11px;overflow-y:auto;
  box-shadow:inset -2px 0 3px rgba(255,255,255,.5), 4px 0 16px rgba(120,100,80,.15);
  z-index:5;
}
#sidebar .logo{
  width:60px;height:60px;border-radius:22px;
  background:linear-gradient(145deg,#f2e6da,#d4b896);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin-bottom:8px;
  box-shadow:var(--clay);
  position:relative;
}
#sidebar .logo::after{
  content:'';position:absolute;inset:5px 5px auto auto;
  width:16px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.7) 0%,transparent 72%);
  pointer-events:none;
}
.nav-item{
  width:70px;height:70px;border-radius:23px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  transition:all .14s ease;position:relative;
  box-shadow:var(--clay-soft);
  color:var(--text);font-family:inherit;
}
.nav-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:13px;height:7px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.nav-item .ico{font-size:26px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.05));}
.nav-item .lb{font-size:9px;color:var(--text-soft);white-space:nowrap;font-weight:600;}
.nav-item.active{
  transform:translateY(2px);
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  box-shadow:var(--clay-press);
}
.nav-item.active::after{opacity:.4;}
.nav-item.active .lb{color:#6b4f3a;font-weight:800;}
#main{flex:1;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 通用组件 ===== */
h1.page-title{font-size:24px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px;}
h1.page-title .t-ico{
  font-size:28px;display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:18px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-soft);
}
.page-sub{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
.card{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:var(--radius);
  box-shadow:var(--clay-card);
  padding:16px;margin-bottom:14px;
  position:relative;
}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* 轻黏土按钮：凸起 + 按下凹陷 */
.btn{
  border:none;border-radius:16px;padding:11px 18px;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .12s ease;color:#fff;
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  box-shadow:var(--clay);
  font-family:inherit;position:relative;
  text-shadow:0 1px 1px rgba(0,0,0,.08);
}
.btn::after{
  content:'';position:absolute;inset:3px 4px auto auto;
  width:34%;height:7px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.5) 0%,transparent 70%);
  pointer-events:none;
}
.btn:active{transform:translateY(3px);box-shadow:var(--clay-press);}
.btn-primary{background:linear-gradient(145deg,#e8d5c4,#c4a882);}
.btn-ghost{
  background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text);
  box-shadow:var(--clay-soft);text-shadow:none;
}
.btn-sm{padding:8px 13px;font-size:12px;border-radius:14px;}
.btn-block{width:100%;}

textarea,input[type=text],input[type=time],input[type=url],input[type=date]{
  width:100%;border:none;border-radius:14px;padding:11px 13px;
  font-size:14px;font-family:inherit;color:var(--text);
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-inset);outline:none;
  -webkit-user-select:text;user-select:text;
}
textarea:focus,input:focus{
  box-shadow:var(--clay-inset),0 0 0 2px rgba(196,168,130,.45);
}
textarea{min-height:80px;resize:vertical;}
label.f-label{font-size:12px;color:var(--text-soft);display:block;margin:10px 0 5px;font-weight:700;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== 打卡页 ===== */
.checklist{display:flex;flex-direction:column;gap:12px;}
.check-item{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  border-radius:20px;padding:12px 14px;
  box-shadow:var(--clay-card);position:relative;
}
.check-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:54px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.check-item .c-ico{
  font-size:24px;width:46px;height:46px;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ffffff,#f5efe6);
  box-shadow:var(--clay-soft);
}
.check-item .c-name{flex:1;font-size:15px;font-weight:700;}
.check-item .c-time{font-size:11px;color:var(--text-soft);margin-top:2px;}
.check-btn{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;font-size:20px;
  transition:all .15s;display:flex;align-items:center;justify-content:center;
  font-family:inherit;font-weight:700;
}
.check-btn.yes{background:linear-gradient(145deg,#c4a882,#a08060);color:#fff;box-shadow:var(--clay);}
.check-btn.no{background:linear-gradient(145deg,#e8d5c4,#c9a890);color:#fff;box-shadow:var(--clay);}
.check-btn.dim{opacity:.45;box-shadow:var(--clay-soft);}
.check-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.check-item.done{background:linear-gradient(145deg,#f0e8dc,#e2d4c0);}
.check-item.done .c-name{color:#6b4f3a;}
.check-item.done .c-ico{background:linear-gradient(145deg,#e8d5c4,#c4a882);}
.check-item.done::after{opacity:.5;}
.done-badge{font-size:20px;}

/* ===== 日历 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .mon{font-size:17px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.cal-grid .wd{font-size:11px;color:var(--text-soft);font-weight:700;padding:4px 0;}
.cal-cell{
  aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:14px;font-weight:700;
  position:relative;cursor:pointer;background:linear-gradient(145deg,#ffffff,#f1f7f3);color:var(--text);
  box-shadow:var(--clay-soft);transition:all .12s;
}
.cal-cell::after{
  content:'';position:absolute;inset:3px 3px auto auto;
  width:16px;height:6px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0%,transparent 72%);
  pointer-events:none;
}
.cal-cell:active{transform:translateY(1px);box-shadow:var(--clay-press);}
.cal-cell .dn{font-size:13px;}
.cal-cell.today{outline:2px dashed var(--mint);outline-offset:-4px;}
.cal-cell.empty{background:transparent;cursor:default;box-shadow:none;}
.cal-cell.empty::after{display:none;}
.cal-cell.zhou{background:linear-gradient(145deg,#f0e8dc,#e2d4c0);color:#6b4f3a;}
.cal-cell.yun{background:linear-gradient(145deg,#d4e2ec,#a8c4d4);color:#3a5a6a;}
.cal-cell.both{background:linear-gradient(145deg,#e2d4c0,#a8c4d4);color:#fff;}
.cal-cell.some{background:linear-gradient(145deg,#f0e8dc,#c4a882);color:#5c4a3a;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-soft);margin:10px 0;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:5px;font-weight:600;}
.legend .sw{width:14px;height:14px;border-radius:6px;display:inline-block;box-shadow:var(--clay-soft);}

/* ===== 全部日历 · 单日汇总 ===== */
.summ-head{display:flex;align-items:center;justify-content:space-between;}
.summ-row{
  margin-bottom:10px;border-radius:18px;
  background:linear-gradient(145deg,#ffffff,#f4f9f6);
  padding:11px 13px;box-shadow:var(--clay-soft);
  border-left:5px solid var(--cc,var(--mint));
  position:relative;
}
.summ-tag{display:flex;align-items:center;gap:10px;}
.summ-ico{
  width:36px;height:36px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:var(--clay-soft);
}
.summ-name{font-weight:700;font-size:14px;}
.summ-time{font-size:11px;color:var(--text-soft);margin-top:2px;}
.summ-status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 11px;border-radius:11px;box-shadow:var(--clay-soft);}
.summ-status.done{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#5c4a3a;}
.summ-status.none{background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text-soft);}
.summ-content{margin-top:8px;padding-left:46px;}
.summ-entry{margin-bottom:8px;}
.summ-text{font-size:13px;line-height:1.6;white-space:pre-wrap;background:#fff;border-radius:12px;padding:8px 11px;margin-bottom:6px;box-shadow:var(--clay-inset);}
.summ-media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;}
.summ-media img,.summ-media video{width:100%;border-radius:10px;object-fit:cover;background:#eee;max-height:90px;box-shadow:var(--clay-soft);}
.summ-plan{font-size:13px;margin-bottom:6px;display:flex;align-items:center;}

/* ===== 心得/媒体卡片 ===== */
.note-item{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:18px;padding:13px;margin-bottom:11px;
  box-shadow:var(--clay-card);position:relative;
}
.note-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:50px;height:8px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,transparent 72%);
  pointer-events:none;
}
.note-item .n-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.note-item .n-date{font-size:11px;color:var(--text-soft);}
.note-item .n-text{font-size:14px;white-space:pre-wrap;line-height:1.6;}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.media-grid img,.media-grid video{width:100%;border-radius:11px;object-fit:cover;background:#eee;box-shadow:var(--clay-soft);}
.media-grid video{max-height:90px;}
.del-btn{
  background:linear-gradient(145deg,#ffffff,#f5efe6);border:none;color:#a06060;
  font-size:11px;cursor:pointer;padding:5px 11px;border-radius:10px;
  box-shadow:var(--clay-soft);font-weight:700;
}
.del-btn:active{transform:translateY(1px);box-shadow:var(--clay-press);}
.book-list{margin-top:8px;}
.book-item{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:14px;padding:9px 11px;margin-bottom:6px;font-size:13px;
  box-shadow:var(--clay-soft);
}

/* ===== 英语 ===== */
.eng-box{background:linear-gradient(145deg,#f5efe6,#e2d4c0);border-radius:18px;padding:14px;box-shadow:var(--clay-inset);}
.eng-phrase{
  font-size:20px;font-weight:700;margin:8px 0;color:#6b4f3a;
  background:#fff;border-radius:14px;padding:12px;box-shadow:var(--clay-inset);
}
.speed-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.speed-btn{
  flex:1;min-width:56px;border:none;border-radius:14px;padding:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  background:linear-gradient(145deg,#ffffff,#f5efe6);color:var(--text);
  box-shadow:var(--clay-soft);font-family:inherit;
}
.speed-btn:active{transform:translateY(2px);box-shadow:var(--clay-press);}
.speed-btn.on{background:linear-gradient(145deg,#e8d5c4,#c4a882);color:#fff;box-shadow:var(--clay-press);}

/* ===== 时间标注 ===== */
.time-set{
  display:flex;align-items:center;gap:8px;margin-bottom:9px;
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
  border-radius:14px;padding:9px 11px;box-shadow:var(--clay-soft);
}
.time-set input{width:auto;flex:1;}

/* ===== 计划表 ===== */
.plan-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:9px;
  box-shadow:var(--clay-card);position:relative;
}
.plan-item::after{
  content:'';position:absolute;inset:4px 4px auto auto;
  width:46px;height:8px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,transparent 72%);
  pointer-events:none;
}
.plan-time{
  font-weight:800;font-size:14px;min-width:82px;color:#fff;
  padding:7px 10px;border-radius:12px;text-align:center;
  box-shadow:var(--clay-soft);text-shadow:0 1px 1px rgba(0,0,0,.08);
}
.plan-ico{
  font-size:22px;width:40px;height:40px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ffffff,#ecf3ee);box-shadow:var(--clay-soft);
}
.plan-name{flex:1;font-size:15px;font-weight:700;}
.plan-tag{font-size:11px;color:var(--text-soft);font-weight:600;}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(145deg,#8b6f4e,#6b4f3a);color:#fff;
  padding:11px 20px;border-radius:18px;font-size:13px;font-weight:600;
  opacity:0;transition:all .3s;z-index:99;pointer-events:none;
  box-shadow:var(--clay);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== Modal ===== */
.modal-mask{
  position:fixed;inset:0;background:rgba(92,74,58,.4);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;z-index:50;
}
.modal-mask.show{display:flex;}
.modal{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);width:100%;
  border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;animation:up .25s;
  box-shadow:0 -6px 24px rgba(140,120,100,.2);
}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.modal .close{
  float:right;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);
  background:linear-gradient(145deg,#ffffff,#f5efe6);width:32px;height:32px;border-radius:12px;
  box-shadow:var(--clay-soft);
}
.modal .close:active{transform:translateY(1px);box-shadow:var(--clay-press);}

/* ===== 首页大时间卡片 ===== */
.hero-card{
  background:linear-gradient(145deg,#f9f4ec,#e8d5c4);
  text-align:center;padding:22px 16px;
}
.hero-greet{
  font-size:18px;font-weight:800;color:#6b4f3a;margin-bottom:8px;
}
.hero-time{
  font-size:48px;font-weight:200;color:#5c4a3a;letter-spacing:2px;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.hero-date{
  font-size:13px;color:var(--text-soft);margin-top:10px;font-weight:500;
}

/* ===== 每日金句卡片 ===== */
.quote-card{
  background:linear-gradient(145deg,#ffffff,#f9f4ec);
}
.quote-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.quote-head span:first-child{
  font-size:15px;font-weight:700;color:#5c4a3a;
}
.quote-tag{
  font-size:11px;font-weight:600;color:#8b6f4e;
  background:linear-gradient(145deg,#f0e8dc,#e2d4c0);
  padding:4px 10px;border-radius:10px;box-shadow:var(--clay-soft);
}
.quote-zh{
  font-size:16px;font-weight:700;color:#5c4a3a;line-height:1.7;margin-bottom:8px;
}
.quote-en{
  font-size:13px;color:var(--text-soft);line-height:1.6;font-style:italic;
}

/* ===== 截图1风格：彩色大圆角卡片 ===== */
.card-pink{
  background:linear-gradient(145deg,#fff0f3,#ffe0e6) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-yellow{
  background:linear-gradient(145deg,#fff8e6,#ffeecc) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-blue{
  background:linear-gradient(145deg,#e8f4ff,#d0e8f7) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-green{
  background:linear-gradient(145deg,#e8f5e9,#d0ebd4) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}
.card-lav{
  background:linear-gradient(145deg,#f0e8ff,#e2d4f7) !important;
  border-radius:28px !important;
  padding:18px 20px !important;
}

/* 用户头像卡片 */
.user-card{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(145deg,#fff0f3,#ffe0e6);
  border-radius:28px;padding:16px 18px;
  box-shadow:var(--clay-card);margin-bottom:14px;
}
.user-avatar{
  width:54px;height:54px;border-radius:20px;
  background:linear-gradient(145deg,#e8d5c4,#c4a882);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:var(--clay-soft);flex-shrink:0;
}
.user-info{flex:1;}
.user-name{font-size:17px;font-weight:800;color:#5c4a3a;}
.user-meta{font-size:12px;color:var(--text-soft);margin-top:3px;}
.user-tag{
  font-size:10px;font-weight:700;color:#a08070;
  background:linear-gradient(145deg,#fff,#f5efe6);

const COLOR_MAP = {
  mint:'#c4a882', sky:'#a8c4d4', lemon:'#e6c88a', lav:'#c4a882',
  peach:'#d4a5a5', sage:'#a8b89a', blush:'#e2d4c0', coral:'#c4a882',

};

  'mint':'#e2d4c0','sky':'#d4e2ec','lemon':'#f2e0b8','lav':'#e2d4c0',

let DB = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem('xiaoang_v1')); return d?deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)),d):JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function deepMerge(base,src){ for(const k in src){ if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])){ base[k]=base[k]||{}; deepMerge(base[k],src[k]); } else base[k]=src[k]; } return base; }
function save(){ localStorage.setItem('xiaoang_v1', JSON.stringify(DB)); }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= 导航渲染 ================= */

/* ---------- 每日打卡 ---------- */
/* ---------- 首页：大时间 + 日期 + 金句 + 打卡 ---------- */
const QUOTES = [
  {zh:'人生没有白走的路，每一步都算数。',en:'No step in life is wasted; every single one counts.'},
  {zh:'星光不问赶路人，时光不负有心人。',en:'The stars do not ask the traveler; time does not betray the devoted.'},

  {zh:'愿你出走半生，归来仍是少年。',en:'May you return after half a lifetime, still a youth at heart.'},
  {zh:'生活不是等待暴风雨过去，而是学会在雨中跳舞。',en:'Life is not about waiting for the storm to pass, but learning to dance in the rain.'},
  {zh:'你的气质里，藏着你读过的书、走过的路。',en:'Your temperament holds the books you\'ve read and the roads you\'ve walked.'},
  {zh:'世界那么大，我想去看看。',en:'The world is so big; I want to go see it.'},
];
function getDailyQuote(){
  const idx = new Date().getDate() % QUOTES.length;
  return QUOTES[idx];
}
function getLunarDate(d){
  // 简易农历：2026年近似映射（非精确，但够用）
  const lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
  const lunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  // 2026年农历正月初一 ≈ 公历 2026-02-17
  const base = new Date(2026,1,17);
  const diff = Math.floor((d - base) / (1000*60*60*24));
  if(diff < 0) return '';
  const lunarMonth = Math.floor(diff / 30) % 12;
  const lunarDay = diff % 30;
  return `农历 ${lunarMonths[lunarMonth]}${lunarDays[Math.min(lunarDay,29)]}`;
}
function renderDaka(){

  const lunar = getLunarDate(now);
  const quote = getDailyQuote();

  pagesEl.innerHTML = `

    </div>

    <!-- 每日金句 -->
    <div class="card card-blue">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:15px;font-weight:800;color:#5c4a3a">💬 今日金句</span>
        <span class="card-tag">每日共勉</span>

    <!-- 打卡列表 -->

            ${DB.times[task.id]?`<div class="mc-time">🕐 ${DB.times[task.id]}</div>`:''}
          </div>
          ${done
            ? `<span class="mc-done">✅</span><button class="mc-btn" data-act="reset" style="font-size:14px">↩️</button>`
            : `<button class="mc-btn" data-act="yes">✓</button>`}
        </div>`;
      }).join('')}
    </div>

    <!-- 快捷入口 -->
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn btn-ghost" style="flex:1" onclick="switchPage('plan')">📋 计划表</button>
      <button class="btn btn-ghost" style="flex:1" onclick="switchPage('time')">🕐 设时间</button>
      <button class="btn btn-ghost" style="flex:1" onclick="switchPage('allcal')">📅 日历</button>
    </div>`;

  // 打卡点击
  pagesEl.querySelectorAll('.mini-check-item').forEach(item=>{
    item.addEventListener('click', e=>{
      const act = e.target.closest('[data-act]')?.dataset.act;
      const id = item.dataset.id;
      if(!act) return;
      DB.checks[t] = DB.checks[t] || {};
      if(act==='yes'){ DB.checks[t][id]=true; toast('已打卡 ✓'); }

}

/* ---------- 互通日历（古筝/运动） ---------- */
let calView = {year:null, month:null};
function renderCal(kind){
  const now = new Date();
  if(!calView.year){ calView.year=now.getFullYear(); calView.month=now.getMonth(); }
  const y=calView.year, m=calView.month;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const isCur = y===now.getFullYear() && m===now.getMonth();
  const title = kind==='guzheng'?'古筝':'运动';
  const emoji = kind==='guzheng'?'🪕':'🏃';
  const color = kind==='guzheng'?'pink':'sky';

  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const z = DB.guzheng[ds]?.done, u = DB.sport[ds]?.done;
    let cls='', txt=d;
    if(z&&u) cls='both';
    else if(kind==='guzheng' && z) cls='zhou';
    else if(kind==='sport' && u) cls='yun';
    else if(kind==='guzheng' && u) cls='yun';  // 互通：运动打卡在古筝日历也可见
    else if(kind==='sport' && z) cls='zhou';
    // 当天高亮
    const isToday = isCur && d===now.getDate();
    cells+=`<div class="cal-cell ${cls} ${isToday?'today':''}" data-ds="${ds}">${d}</div>`;
  }
  const monLabel = `${y}年${m+1}月`;
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">${emoji}</span>${title}</h1>
    <div class="page-sub">${kind==='guzheng'?'与「运动」日历互通 · 点击日期打卡/写心得':'与「古筝」日历互通 · 点击日期打卡/写心得'}</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="prevM">‹ 上月</button>
        <div class="mon">${monLabel}</div>
        <button class="btn btn-ghost btn-sm" id="nextM">› 下月</button>
      </div>
      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><span class="sw" style="background:${COLOR_MAP.blush}"></span>古筝打卡</span>
        <span><span class="sw" style="background:${COLOR_MAP.sky}"></span>运动打卡</span>
        <span><span class="sw" style="background:linear-gradient(135deg,${COLOR_MAP.blush},${COLOR_MAP.sky})"></span>均打卡</span>
      </div>
    </div>
    <div class="card">
      <h3>📅 选中日期详情</h3>
      <div id="dayDetail">请点击上方日期查看</div>
    </div>`;
  document.getElementById('prevM').onclick=()=>{ calView.month--; if(calView.month<0){calView.month=11;calView.year--;} renderCal(kind); };
  document.getElementById('nextM').onclick=()=>{ calView.month++; if(calView.month>11){calView.month=0;calView.year++;} renderCal(kind); };
  pagesEl.querySelectorAll('.cal-cell:not(.empty)').forEach(c=>{
    c.onclick=()=>showDayDetail(c.dataset.ds, kind);
  });
}

/* ---------- 全部日历：综合视图 ---------- */
let allCalView = {year:null, month:null, selected:null};
function renderAllCal(){
  const now = new Date();
  if(!allCalView.year){ allCalView.year=now.getFullYear(); allCalView.month=now.getMonth(); allCalView.selected=todayStr(); }
  const y=allCalView.year, m=allCalView.month, sel=allCalView.selected;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const isCur = y===now.getFullYear() && m===now.getMonth();
  const monLabel = `${y}年${m+1}月`;

  let cells='';
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const doneCount = countDayDone(ds);
    let cls='', tip = `本日 ${doneCount} 项已打卡`;
    if(doneCount>=6) cls='both';
    else if(doneCount>=3) cls='some';
    else if(doneCount>0) cls='zhou';
    const isToday = isCur && d===now.getDate();
    if(sel===ds) cls += ' today';
    cells+=`<div class="cal-cell ${cls}" data-ds="${ds}" title="${tip}">${d}</div>`;
  }

  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">📅</span>全部日历</h1>
    <div class="page-sub">点击日期查看该日所有类别的计划与实际完成情况</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="prevM2">‹ 上月</button>
        <div class="mon">${monLabel}</div>
        <button class="btn btn-ghost btn-sm" id="nextM2">› 下月</button>
      </div>
      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><span class="sw" style="background:${SOFT_MAP.blush}"></span>1-2 项</span>
        <span><span class="sw" style="background:${SOFT_MAP.mint}"></span>3-5 项</span>
        <span><span class="sw" style="background:linear-gradient(135deg,${SOFT_MAP.blush},${SOFT_MAP.sky})"></span>6+ 项（完成度高）</span>
      </div>
    </div>
    <div id="daySummary">${renderDaySummary(sel)}</div>`;
  document.getElementById('prevM2').onclick=()=>{ allCalView.month--; if(allCalView.month<0){allCalView.month=11;allCalView.year--;} renderAllCal(); };
  document.getElementById('nextM2').onclick=()=>{ allCalView.month++; if(allCalView.month>11){allCalView.month=0;allCalView.year++;} renderAllCal(); };
  pagesEl.querySelectorAll('.cal-cell:not(.empty)').forEach(c=>{
    c.onclick=()=>{ allCalView.selected=c.dataset.ds; renderAllCal(); };
  });
}
function countDayDone(ds){
  const c = DB.checks[ds]||{};
  const z = DB.guzheng[ds]?.done;
  const s = DB.sport[ds]?.done;
  let n=0;
  CHECK_TASKS.forEach(t=>{ if(c[t.id]) n++; });
  if(z) n++;
  if(s) n++;
  return n;
}
function renderDaySummary(ds){
  // 周几
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(ds).getDay()];
  // 计划（按时间）
  const plans = CATS.filter(c=>c.id!=='daka' && DB.times[c.id])
    .map(c=>({...c, time:DB.times[c.id]}))
    .sort((a,b)=>a.time.split('-')[0].localeCompare(b.time.split('-')[0]));
  // 实际完成
  const checks = DB.checks[ds]||{};
  const z = DB.guzheng[ds]||{};
  const s = DB.sport[ds]||{};
  // 其他类别当日条目
  const dayEntries = (kind)=>Object.values(DB[kind]||{}).filter(e=>e.date===ds);

  // 左列：所有 8 个类别
  const left = CATS2.map(c=>{
    const time = DB.times[c.id] || '';
    let done=false, content='';
    if(c.id==='daka'){ /* 跳过——下方用其他表示 */ }
    if(c.id==='guzheng'){ done=!!z.done; if(z.note) content+=`<div class="summ-text">${escapeHtml(z.note)}</div>`; if((z.videos||[]).length) content+=`<div class="summ-media">${z.videos.map(v=>`<video src="${v}" controls></video>`).join('')}</div>`; }
    else if(c.id==='sport'){ done=!!s.done; if(s.note) content+=`<div class="summ-text">${escapeHtml(s.note)}</div>`; if((s.videos||[]).length) content+=`<div class="summ-media">${s.videos.map(v=>`<video src="${v}" controls></video>`).join('')}</div>`; }
    else {
      const entries = dayEntries(c.id);
      if(entries.length){
        done=true;
        content = entries.map(e=>{
          let media='';
          if((e.imgs||[]).length) media += `<div class="summ-media">${e.imgs.map(s=>`<img src="${s}">`).join('')}</div>`;
          if((e.videos||[]).length) media += `<div class="summ-media">${e.videos.map(s=>`<video src="${s}" controls></video>`).join('')}</div>`;
          return `<div class="summ-entry">${e.text?`<div class="summ-text">${escapeHtml(e.text)}</div>`:''}${media}</div>`;
        }).join('');
      }
    }
    return `<div class="summ-row" style="--cc:${COLOR_MAP[c.color]};--ss:${SOFT_MAP[c.color]}">
      <div class="summ-tag">
        <span class="summ-ico" style="background:${COLOR_MAP[c.color]}">${c.emoji}</span>
        <div>
          <div class="summ-name">${c.name}</div>
          ${time?`<div class="summ-time">🕐 ${time}</div>`:''}
        </div>
        <span class="summ-status ${done?'done':'none'}">${done?'✓ 完成':'— 未做'}</span>
      </div>
      ${content?`<div class="summ-content">${content}</div>`:''}
    </div>`;
  }).join('');

  // 顶部统计
  const doneN = countDayDone(ds);
  return `<div class="card">
    <div class="summ-head">
      <div>
        <div style="font-size:18px;font-weight:800">${ds} · ${wd}</div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:4px">完成 ${doneN}/${CHECK_TASKS.length+2} 项任务</div>
      </div>
      <div style="font-size:32px;font-weight:800;color:var(--mint)">${Math.round(doneN/(CHECK_TASKS.length+2)*100)}%</div>
    </div>
  </div>
  <div class="card">
    <h3>🗂️ 各类别 · 计划与实际</h3>
    ${left}
  </div>
  ${plans.length?`<div class="card">
    <h3>🕐 当日计划（按时间）</h3>
    ${plans.map(p=>`<div class="summ-plan"><span style="background:${COLOR_MAP[p.color]};color:#fff;padding:3px 9px;border-radius:8px;font-weight:700;font-size:12px">${p.time}</span><span style="margin-left:8px">${p.emoji} ${p.name}</span></div>`).join('')}
  </div>`:''}`;
}

function showDayDetail(ds, kind){
  const z = DB.guzheng[ds]||{done:false,note:'',videos:[]};
  const u = DB.sport[ds]||{done:false,note:'',videos:[]};
  const detail = document.getElementById('dayDetail');
  if(!detail) return;
  detail.innerHTML = `
    <div style="font-weight:700;margin-bottom:10px">${ds}</div>
    <div class="chip-row" style="margin-bottom:10px">
      <button class="btn btn-sm ${z.done?'':'btn-ghost'}" style="${z.done?'background:'+COLOR_MAP.blush+';color:#a05f7a':''}" id="togZ">🪕 古筝 ${z.done?'已打卡':'未打卡'}</button>
      <button class="btn btn-sm ${u.done?'':'btn-ghost'}" style="${u.done?'background:'+COLOR_MAP.sky:''}" id="togU">🏃 运动 ${u.done?'已打卡':'未打卡'}</button>
    </div>
    <label class="f-label">写心得</label>
    <textarea id="dayNote" placeholder="记录今天的心得…">${(kind==='guzheng'?z.note:u.note)||''}</textarea>
    <label class="f-label">上传视频</label>
    <input type="file" id="dayVideo" accept="video/*" multiple>
    <div class="media-grid" id="dayVideos">
      ${(kind==='guzheng'?z.videos:u.videos).map(v=>`<video src="${v}" controls></video>`).join('')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" id="saveDay">保存</button>`;

  // 视频：转 base64 存 localStorage（小视频）
  document.getElementById('dayVideo').addEventListener('change', async e=>{
    const kind2 = kind;
    const rec = DB[kind2][ds]||(DB[kind2][ds]={done:false,note:'',videos:[]});
    for(const f of e.target.files){
      if(f.size > 8*1024*1024){ toast('视频太大(>8MB)，请压缩'); continue; }
      const data = await fileToDataURL(f);
      rec.videos.push(data);
    }
    save(); showDayDetail(ds,kind2); toast('视频已上传');
  });

  document.getElementById('togZ').onclick=()=>{
    DB.guzheng[ds]=DB.guzheng[ds]||{done:false,note:'',videos:[]};
    DB.guzheng[ds].done=!DB.guzheng[ds].done;
    // 互通：同步到每日打卡
    if(DB.guzheng[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].guzheng=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('togU').onclick=()=>{
    DB.sport[ds]=DB.sport[ds]||{done:false,note:'',videos:[]};
    DB.sport[ds].done=!DB.sport[ds].done;
    if(DB.sport[ds].done){ DB.checks[ds]=DB.checks[ds]||{}; DB.checks[ds].sport=true; }
    save(); showDayDetail(ds,kind);
  };
  document.getElementById('saveDay').onclick=()=>{
    const rec = DB[kind][ds]||(DB[kind][ds]={done:false,note:'',videos:[]});
    rec.note = document.getElementById('dayNote').value;
    save(); toast('心得已保存'); showDayDetail(ds,kind);
  };
}

  }[kind];
  const entries = Object.values(DB[kind]||{}).sort((a,b)=>(b.date||0)-(a.date||0));
  pagesEl.innerHTML = `

      <h3>✍️ 写心得</h3>

        <label class="f-label">📚 预留书名</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="newBook" placeholder="输入书名并添加到书单">

        <div class="book-list" id="bookList"></div>`:''}
      ${cfg.allowImg?`<label class="f-label">🖼️ 上传图片</label><input type="file" id="newImgs" accept="image/*" multiple>`:''}
      ${cfg.allowVideo?`<label class="f-label">🎬 上传视频</label><input type="file" id="newVideos" accept="video/*" multiple>`:''}
      <button class="btn btn-primary btn-block" style="margin-top:14px" id="saveEntry">发布</button>

    <div id="entries">${entries.map(en=>entryHTML(en,cfg)).join('')||'<div style="text-align:center;color:var(--text-soft);padding:20px">还没有记录哦～</div>'}</div>`;

  // 书名
  if(cfg.allowBook){
    const bl = document.getElementById('bookList');
    const renderBooks=()=>{ bl.innerHTML = DB.books.map(b=>`<div class="book-item"><span>📕</span><span style="flex:1">${escapeHtml(b.name)}</span><button class="del-btn" data-bid="${b.id}">删除</button></div>`).join(''); };
    renderBooks();
    document.getElementById('addBook').onclick=()=>{
      const v=document.getElementById('newBook').value.trim(); if(!v) return toast('请输入书名');
      DB.books.push({id:uid(),name:v}); save(); document.getElementById('newBook').value=''; renderBooks(); toast('已加入书单');
    };
    bl.addEventListener('click',e=>{
      const d=e.target.closest('[data-bid]'); if(!d) return;
      DB.books=DB.books.filter(b=>b.id!==d.dataset.bid); save(); renderBooks();
    });
  }

  // 发布新记录
  document.getElementById('saveEntry').onclick=async()=>{
    const text = document.getElementById('newNote').value.trim();
    const imgs=[], videos=[];
    if(document.getElementById('newImgs')){ for(const f of document.getElementById('newImgs').files){ if(f.size>8*1024*1024){toast('图片太大');continue;} imgs.push(await fileToDataURL(f)); } }
    if(document.getElementById('newVideos')){ for(const f of document.getElementById('newVideos').files){ if(f.size>8*1024*1024){toast('视频太大(>8MB)');continue;} videos.push(await fileToDataURL(f)); } }
    if(!text && !imgs.length && !videos.length) return toast('请先填写心得或上传文件');
    DB[kind]=DB[kind]||{};
    const id=uid();
    DB[kind][id]={id,date:todayStr(),ts:Date.now(),text,imgs,videos};
    save(); renderDiary(kind); toast('已发布');
  };
  // 删除
  pagesEl.querySelector('#entries').addEventListener('click',e=>{
    const d=e.target.closest('[data-del]'); if(!d) return;
    delete DB[kind][d.dataset.del]; save(); renderDiary(kind);
  });
}

function entryHTML(en,cfg){

  return `<div class="note-item">
    <div class="n-head"><span class="n-date">${en.date}</span><button class="del-btn" data-del="${en.id}">删除</button></div>

    ${(imgs||vids)?`<div class="media-grid">${imgs}${vids}</div>`:''}
  </div>`;
}

/* ---------- 读书：书籍管理（截图2风格） ---------- */
const BOOK_CATS = ['文学','英语','小说','励志','经济'];
const BOOK_STATUS = ['未读','在读','已读'];

function renderReadBooks(){
  const books = DB.readBooks || [];
  const unread = books.filter(b=>b.status==='未读');
  const reading = books.filter(b=>b.status==='在读');
  const finished = books.filter(b=>b.status==='已读');

  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">📖</span>读书</h1>
    <div class="page-sub">管理你的阅读进度</div>

    <button class="add-book-btn" id="openAddBook">+ 添加书籍</button>

    <!-- 统计 -->
    <div class="stat-badges">
      <div class="stat-badge"><div class="num">${unread.length}</div><div class="lab">未读</div></div>
      <div class="stat-badge"><div class="num">${reading.length}</div><div class="lab">在读</div></div>
      <div class="stat-badge"><div class="num">${finished.length}</div><div class="lab">已读</div></div>
    </div>

    <!-- 在读 -->
    ${reading.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📚 在读 (${reading.length}本)</div>
      ${reading.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 未读 -->
    ${unread.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">📖 未读 (${unread.length}本)</div>
      ${unread.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    <!-- 已读 -->
    ${finished.length?`<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);margin-bottom:8px">✅ 已读 (${finished.length}本)</div>
      ${finished.map(b=>bookCardHTML(b)).join('')}
    </div>`:''}

    ${!books.length?'<div style="text-align:center;color:var(--text-soft);padding:30px">还没有书籍，点击上方「+ 添加书籍」开始记录吧～</div>':''}

    <!-- 旧版日记兼容 -->
    <div style="margin-top:20px">
      <button class="btn btn-ghost btn-block" onclick="switchPage('inspire')" style="font-size:12px">📔 查看旧版读书笔记</button>
    </div>`;

  document.getElementById('openAddBook').onclick = ()=> showBookModal();

  // 编辑/删除
  pagesEl.querySelectorAll('.bc-actions').forEach(row=>{
    row.addEventListener('click', e=>{
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-del]');
      if(editBtn) showBookModal(editBtn.dataset.edit);
      if(delBtn){
        if(confirm('确定删除这本书吗？')){
          DB.readBooks = DB.readBooks.filter(b=>b.id!==delBtn.dataset.del);
          save(); renderReadBooks(); toast('已删除');
        }
      }
    });
  });
}

function bookCardHTML(b){
  const pct = b.totalPages>0 ? Math.round((b.currentPage||0)/b.totalPages*100) : 0;
  const statusClass = b.status==='未读'?'unread':b.status==='在读'?'reading':'finished';
  return `<div class="book-card">
    <div class="bc-head">
      <div class="bc-cover">📕</div>
      <div class="bc-info">
        <div class="bc-title">${escapeHtml(b.title||'未命名')}</div>

    <div class="bc-progress"><div class="bc-progress-bar" style="width:${pct}%"></div></div>

    <div class="bc-actions">
      <button data-edit="${b.id}">编辑</button>

  const title = book?.title||'';
  const author = book?.author||'';

  const category = book?.category||'文学';
  const status = book?.status||'未读';
  const currentPage = book?.currentPage||'';

  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:17px;font-weight:800">${isEdit?'编辑书籍':'添加书籍'}</div>

        <label class="f-label">总页数</label>

    </div>
    <div class="form-row">

        <label class="f-label">分类</label>
        <select id="bCat">
          ${BOOK_CATS.map(c=>`<option value="${c}" ${c===category?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="f-label">状态</label>
        <select id="bStatus">
          ${BOOK_STATUS.map(s=>`<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <label class="f-label">当前页数</label>
    <input type="number" id="bCurrent" placeholder="0" value="${currentPage}">
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-ghost" style="flex:1" id="cancelBook">取消</button>
      <button class="btn btn-primary" style="flex:1" id="saveBook">保存</button>
    </div>`;

  document.getElementById('modalMask').classList.add('show');

  document.getElementById('closeModal').onclick = ()=> document.getElementById('modalMask').classList.remove('show');
  document.getElementById('cancelBook').onclick = ()=> document.getElementById('modalMask').classList.remove('show');
  document.getElementById('saveBook').onclick = ()=>{
    const t = document.getElementById('bTitle').value.trim();
    if(!t){ toast('请输入书名'); return; }
    const data = {
      id: isEdit ? bookId : uid(),
      title: t,
      author: document.getElementById('bAuthor').value.trim(),
      totalPages: parseInt(document.getElementById('bTotal').value)||0,
      category: document.getElementById('bCat').value,
      status: document.getElementById('bStatus').value,
      currentPage: parseInt(document.getElementById('bCurrent').value)||0,
      addedDate: isEdit ? (book?.addedDate||todayStr()) : todayStr()
    };
    if(isEdit){
      const idx = DB.readBooks.findIndex(b=>b.id===bookId);
      if(idx>=0) DB.readBooks[idx]=data;
    } else {
      DB.readBooks.push(data);
    }
    save();
    document.getElementById('modalMask').classList.remove('show');
    renderReadBooks();
    toast(isEdit?'已保存':'已添加');
  };
}

/* ---------- 英语 ---------- */
let engRate = 1;
function renderEnglish(){
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">🗣️</span>英语学习</h1>
    <div class="page-sub">说出英语 → 提取语句 → 美式配音变速跟读</div>
    <div class="card eng-box">
      <h3>🎤 口语输入</h3>
      <button class="btn btn-primary btn-block" id="recBtn">🎙️ 开始录音</button>
      <div id="recStatus" style="font-size:12px;color:var(--text-soft);margin-top:8px">点击按钮后对着麦克风说英文，说完再点一次停止</div>
      <label class="f-label">识别到的语句</label>
      <div class="eng-phrase" id="engPhrase">（尚未识别）</div>
      <label class="f-label">也可以手动输入语句</label>
      <textarea id="engInput" placeholder="手动输入英文句子…"></textarea>
    </div>
    <div class="card">
      <h3>🔊 美式配音 · 变速跟读</h3>
      <div class="speed-row">
        ${[0.5,0.75,1,1.5].map(r=>`<button class="speed-btn ${r===engRate?'on':''}" data-rate="${r}">${r}×</button>`).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px" id="speakBtn">▶️ 播放配音</button>
    </div>`;
  // 录音：实时识别
  let isListening=false;
  document.getElementById('recBtn').onclick=()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ toast('当前浏览器不支持语音识别，请手动输入'); return; }
    if(isListening){ if(recognition) recognition.stop(); return; }
    recognition = new SR();
    recognition.lang='en-US';
    recognition.interimResults=false;
    recognition.continuous=false;
    isListening=true;
    document.getElementById('recBtn').textContent='⏹️ 停止录音';
    document.getElementById('recStatus').textContent='录音中…请说英文';
    recognition.onresult=e=>{
      const text=e.results[0][0].transcript;
      document.getElementById('engPhrase').textContent=text;
      document.getElementById('engInput').value=text;
      document.getElementById('recStatus').textContent='识别完成 ✓';
      isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音';
    };
    recognition.onerror=()=>{ document.getElementById('recStatus').textContent='识别失败，请重试或手动输入'; isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; };
    recognition.onend=()=>{ if(isListening){ isListening=false; document.getElementById('recBtn').textContent='🎙️ 开始录音'; } };
    recognition.start();
  };
  // 变速
  pagesEl.querySelectorAll('.speed-btn').forEach(b=>{
    b.onclick=()=>{ engRate=parseFloat(b.dataset.rate); renderEnglish(); };
  });
  // 播放
  document.getElementById('speakBtn').onclick=()=>{
    let text = document.getElementById('engInput').value.trim() || document.getElementById('engPhrase').textContent;
    if(text==='（尚未识别）'||!text) return toast('请先输入或识别语句');
    speak(text, engRate);
  };
}

/* ---------- 时间标注 & 计划表 ---------- */
function renderTimes(){
  // 嵌入到每个页面底部：时间设置 + 计划表入口。这里单独页面
  return `<div class="card">
    <h3>🕐 为每个类别设置时间段</h3>
    ${CATS.filter(c=>c.id!=='daka').map(c=>`
      <div class="time-set">
        <span style="width:70px;font-size:13px">${c.emoji} ${c.name}</span>
        <input type="time" value="${(DB.times[c.id]||'').split('-')[0]||''}" data-id="${c.id}" data-part="start">
        <span>—</span>
        <input type="time" value="${(DB.times[c.id]||'').split('-')[1]||''}" data-id="${c.id}" data-part="end">
      </div>`).join('')}
    <button class="btn btn-primary btn-block" id="saveTimes">💾 保存时间</button>
  </div>`;
}

function renderPlan(){
  const items = CATS.filter(c=>c.id!=='daka').map(c=>({
    ...c, time: DB.times[c.id] || '', start: (DB.times[c.id]||'').split('-')[0]||''
  })).filter(x=>x.time).sort((a,b)=>a.start.localeCompare(b.start));
  const t=todayStr(); const checks=DB.checks[t]||{};
  pagesEl.innerHTML = `
    <h1 class="page-title"><span class="t-ico">📋</span>今日计划表</h1>
    <div class="page-sub">${t} · 按时间顺序排列</div>
    ${items.length? items.map((it,idx)=>{
      const done=checks[it.id];
      return `<div class="plan-item" style="background:${COLOR_MAP[it.color]}22">
        <div class="plan-time" style="background:${COLOR_MAP[it.color]}">${it.time}</div>
        <span class="plan-ico">${it.emoji}</span>
        <div class="plan-name">${it.name}</div>
        ${done?'<span style="font-size:16px">✅</span>':'<span class="plan-tag">待完成</span>'}
      </div>`;
    }).join('') : '<div style="text-align:center;color:var(--text-soft);padding:30px">还没有设置时间，请先在「设置时间」里标注时间段</div>'}
    <div style="margin-top:16px">
      <button class="btn btn-ghost btn-block" onclick="switchPage('time')">🕐 设置时间段</button>
    </div>`;
}

function renderTimePage(){
  pagesEl.innerHTML = `<h1 class="page-title"><span class="t-ico">🕐</span>设置时间段</h1>
    <div class="page-sub">为每个类别标注时间，自动生成计划表</div>`+renderTimes();
  document.getElementById('saveTimes').onclick=()=>{
    pagesEl.querySelectorAll('.time-set').forEach(ts=>{
      const s=ts.querySelector('[data-part=start]').value, e=ts.querySelector('[data-part=end]').value;
      const id=ts.querySelector('[data-part=start]').dataset.id;
      if(s&&e) DB.times[id]=`${s}-${e}`;
      else if(!s&&!e) delete DB.times[id];
    });
    save(); toast('时间已保存'); switchPage('daka');
  };
}

/* ================= 工具函数 ================= */
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 实时语音识别用全局 recognition 变量 */

/* TTS 美式发音 + 变速 */
function speak(text, rate){
  if(!('speechSynthesis' in window)) return toast('浏览器不支持语音合成');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate = rate;
  // 选美式声音
  const voices = speechSynthesis.getVoices();
  const enVoice = voices.find(v=>v.lang==='en-US' && /Samantha|Google US English|Alex/i.test(v.name)) || voices.find(v=>v.lang==='en-US');
  if(enVoice) u.voice=enVoice;
  speechSynthesis.speak(u);
}

/* ================= 初始化 ================= */
// 预加载声音
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
switchPage('daka');
</script>
